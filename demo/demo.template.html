<title>Backrooms Studio Hub</title>
<script type="importmap">
{ "imports": {
  "three": "__THREE_BASE__/build/three.module.js",
  "three/addons/": "__THREE_BASE__/examples/jsm/"
} }
</script>
<style>
/* Layout: sticky chrome nav + single 1320px column of cards; one-screen app, hash-routed.
   Tokens and components are the real hub's design system (src/app/globals.css), inlined. */
__HUB_CSS__
/* demo-only adjustments */
.topbar { top: env(safe-area-inset-top, 0px); }
.demo-ribbon { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 7px 16px; font-size: 12.5px; color: var(--text-2); background: linear-gradient(90deg, rgba(255,214,10,.08), rgba(255,214,10,.02)); border-bottom: 1px solid rgba(255,214,10,.18); }
.demo-ribbon b { color: var(--warn); font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 100; padding: 11px 18px; border-radius: 999px; font-size: 13.5px; background: rgba(28,28,30,.92); backdrop-filter: blur(14px); box-shadow: 0 0 0 1px var(--hairline-strong) inset, 0 16px 40px rgba(0,0,0,.6); color: var(--text); max-width: calc(100vw - 32px); }
.chart3d .tip-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.chart3d .chart-tip { position: absolute; transform: translate(-50%, calc(-100% - 14px)); }
.chart3d .month-label { position: absolute; transform: translate(-50%, 0); color: var(--text-2); text-shadow: 0 1px 6px rgba(0,0,0,.9); }
.spark-wrap { position: relative; }
.spark-wrap .chart-tip { position: absolute; bottom: 52px; min-width: 0; z-index: 5; }
button.linklike { background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
</style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Backrooms Studio Hub · demo navigabile
   Stesse schermate dell'hub, dati inventati tenuti in memoria (si azzerano ricaricando).
   ═══════════════════════════════════════════════════════════════════════════ */
const LOGO = "data:image/png;base64,__LOGO_B64__";
const PARTNERS = ["Plugghe", "Freya", "Astral"];
const DEMO_PASSWORD = "backrooms-demo";

// ─── formatting ─────────────────────────────────────────────────────────────
const eurF = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" });
const numF = new Intl.NumberFormat("it-IT");
const compactF = new Intl.NumberFormat("it-IT", { notation: "compact", maximumFractionDigits: 1 });
const fmtEur = (c) => eurF.format(c / 100);
const fmtNum = (n) => numF.format(Math.round(n));
const fmtCompact = (n) => compactF.format(n);
const fmtPct = (n) => `${(n * 100).toFixed(1).replace(".", ",")}%`;
const MONTHS = ["Gen", "Feb", "Mar", "Apr", "Mag", "Giu", "Lug", "Ago", "Set", "Ott", "Nov", "Dic"];
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (s, n) => { const d = new Date(`${s}T12:00:00`); d.setDate(d.getDate() + n); return iso(d); };
const fmtDate = (s) => new Date(`${s.slice(0, 10)}T12:00:00`).toLocaleDateString("it-IT", { day: "2-digit", month: "short", year: "numeric" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const parseEuro = (s) => { let t = String(s).trim().replace(/[€\s]/g, ""); if (t.includes(",")) t = t.replace(/\./g, "").replace(",", "."); const n = Number(t); return Number.isFinite(n) ? Math.round(n * 100) : null; };

const NOW = new Date();
const TODAY = iso(NOW);
const YEAR = NOW.getFullYear();

// ─── demo data (deterministic) ──────────────────────────────────────────────
let seed = 42;
const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
let uid = 1;

const CAT_IN = ["Sessioni", "Mix & Master", "Produzioni", "Pacchetti", "Beat", "Altro"];
const CAT_OUT = ["Affitto", "Attrezzatura", "Software & Plugin", "Marketing", "Utenze", "Compensi", "Tasse", "Altro"];
const SERVICES = ["Registrazione", "Mix", "Master", "Produzione", "Sessione vocale", "Beat", "Editing"];
const PRESETS = [
  { name: "Singolo Completo", price: 350, items: [["Registrazione", 1], ["Mix", 1], ["Master", 1]] },
  { name: "EP Pack", price: 1500, items: [["Registrazione", 5], ["Mix", 5], ["Master", 5]] },
  { name: "Produzione + Singolo", price: 600, items: [["Produzione", 1], ["Registrazione", 1], ["Mix", 1], ["Master", 1]] },
  { name: "Vocal Sessions x4", price: 280, items: [["Sessione vocale", 4]] },
  { name: "Mix & Master x3", price: 390, items: [["Mix", 3], ["Master", 3]] },
];
const LEAD_STATUSES = ["nuovo", "contattato", "in trattativa", "convertito", "perso"];
const NOTE_CATS = ["Strategia", "Crescita", "Marketing", "Operativo", "Promemoria", "Idea"];
const ARTIST_NAMES = ["Kaos Melodico", "Aria Blu", "Dr. Bassi", "Nebbia", "Lunaria", "Vento Sud", "Mirto", "Sabbia"];

function makeData() {
  const tx = [];
  for (let m = 0; m <= NOW.getMonth(); m++) {
    const season = 1 + 0.35 * Math.sin((m / 12) * Math.PI * 2 - 1);
    const n = Math.round(14 * season + rand() * 6);
    const lastDay = m === NOW.getMonth() ? NOW.getDate() : 27;
    for (let i = 0; i < n; i++) {
      const cash = rand() < 0.3;
      const cat = rand() < 0.5 ? "Sessioni" : rand() < 0.6 ? "Mix & Master" : "Pacchetti";
      const amount = Math.round((cat === "Pacchetti" ? 350 + rand() * 900 : 60 + rand() * 220) * 100);
      const who = ARTIST_NAMES[Math.floor(rand() * ARTIST_NAMES.length)];
      tx.push({ id: uid++, date: iso(new Date(YEAR, m, 1 + Math.floor(rand() * lastDay), 12)), cents: amount, desc: `${cat} — ${who}`, cat, source: cash ? "cash" : "bank", by: cash ? PARTNERS[Math.floor(rand() * 3)] : "" });
    }
    const fixed = [["Affitto", 1400, "Canone studio"], ["Utenze", 180 + rand() * 120, "Bolletta luce e internet"], ["Software & Plugin", 60 + rand() * 90, "Abbonamenti plugin"], ["Marketing", 150 + rand() * 350, "Sponsorizzate Instagram"]];
    if (rand() < 0.35) fixed.push(["Attrezzatura", 300 + rand() * 1800, "Microfono / outboard"]);
    fixed.forEach(([cat, eur, desc], i) => {
      const day = 3 + i * 5;
      if (m === NOW.getMonth() && day > NOW.getDate()) return;
      tx.push({ id: uid++, date: iso(new Date(YEAR, m, day, 12)), cents: -Math.round(eur * 100), desc, cat, source: "bank", by: "" });
    });
  }

  const leads = [
    ["Nova Kid", "nova.kid@example.com", "+39 333 120 4455", "novakid", "Trap", "Cerca un EP da 5 tracce entro marzo", "drive", "nuovo"],
    ["Lara V", "lara.v@example.com", "", "laravmusic", "R&B", "Vuole sessioni vocali settimanali", "sito", "contattato"],
    ["Gemma Rossi", "gemma@example.com", "+39 347 880 1200", "", "Pop", "Singolo + videoclip, budget 900 €", "manuale", "in trattativa"],
    ["Sabbia", "sabbia.band@example.com", "", "sabbiaband", "Indie", "Band di 4, registrazione live", "drive", "nuovo"],
    ["Rocco Beats", "rocco@example.com", "", "roccobeats", "Hip hop", "Ha chiesto il listino beat", "sito", "perso"],
  ].map(([name, email, phone, ig, genre, notes, source, status]) => ({ id: uid++, name, email, phone, ig, genre, notes, source, status, created: addDays(TODAY, -Math.floor(rand() * 40)) }));

  const pkg = (name, price, list, done, daysAgo) => {
    const items = [];
    list.forEach(([s, q]) => { for (let i = 0; i < q; i++) items.push({ id: uid++, service: q > 1 ? `${s} ${i + 1}/${q}` : s, done: false, by: "", at: "" }); });
    items.slice(0, done).forEach((it) => { it.done = true; it.by = PARTNERS[Math.floor(rand() * 3)]; it.at = addDays(TODAY, -Math.floor(rand() * daysAgo)); });
    return { id: uid++, name, price: price * 100, purchased: addDays(TODAY, -daysAgo), archived: false, items };
  };
  const artists = [
    { id: uid++, name: "Kaos Melodico", email: "kaos@example.com", phone: "", ig: "@kaosmelodico", packages: [pkg("EP Pack", 1500, [["Registrazione", 5], ["Mix", 5], ["Master", 5]], 13, 60)] },
    { id: uid++, name: "Aria Blu", email: "aria@example.com", phone: "", ig: "@ariablu", packages: [pkg("Singolo Completo", 350, [["Registrazione", 1], ["Mix", 1], ["Master", 1]], 3, 20)] },
    { id: uid++, name: "Dr. Bassi", email: "", phone: "+39 340 555 0192", ig: "@drbassi", packages: [pkg("Vocal Sessions x4", 280, [["Sessione vocale", 4]], 1, 10)] },
    { id: uid++, name: "Lunaria", email: "lunaria@example.com", phone: "", ig: "@lunaria", packages: [pkg("Produzione + Singolo", 600, [["Produzione", 1], ["Registrazione", 1], ["Mix", 1], ["Master", 1]], 2, 14)] },
  ];

  const metrics = {};
  let igF = 4200, ttF = 9800;
  for (let d = 60; d >= 1; d--) {
    const date = addDays(TODAY, -d);
    igF += Math.round(rand() * 25 - 3);
    ttF += Math.round(rand() * 60 - 8);
    const igV = Math.round(2500 + rand() * 4000), ttV = Math.round(5000 + rand() * 15000), users = Math.round(80 + rand() * 140);
    metrics[date] = {
      instagram: { views: igV, reach: Math.round(igV * (0.45 + rand() * 0.2)), followers: igF, interactions: Math.round(igV * (0.03 + rand() * 0.03)), saves: Math.round(10 + rand() * 40), shares: Math.round(5 + rand() * 30) },
      tiktok: { views: ttV, followers: ttF, interactions: Math.round(ttV * (0.04 + rand() * 0.04)), shares: Math.round(20 + rand() * 80), comments: Math.round(15 + rand() * 60) },
      web: { users, sessions: Math.round(users * 1.3), engagement_rate: 0.45 + rand() * 0.2, clicks: Math.round(users * (0.1 + rand() * 0.1)), applications: Math.floor(rand() * 4) },
    };
  }

  const apps = [
    { name: "Lara V", email: "lara.v@example.com", kind: "prenotazione", message: "Vorrei bloccare 4 sessioni vocali a novembre", at: addDays(TODAY, -2) },
    { name: "Rocco Beats", email: "rocco@example.com", kind: "candidatura", message: "Mi mandate il listino dei beat?", at: addDays(TODAY, -5) },
    { name: "Nova Kid", email: "nova.kid@example.com", kind: "candidatura", message: "Ciao! Ho 5 pezzi pronti per un EP", at: addDays(TODAY, -9) },
  ];

  const notes = [
    { id: uid++, title: "Pacchetto “Emergenti” per l'inverno", body: "Bundle 3 singoli con sconto 15%, pensato per chi arriva dal sito. Proporlo a tutti i contatti 'nuovo' entro fine mese.", cat: "Strategia", pinned: true, done: false, due: null, author: "Plugghe", updated: addDays(TODAY, -3) },
    { id: uid++, title: "Backup settimanale del database", body: "Copiare data\\hub.db su Drive ogni lunedì.", cat: "Promemoria", pinned: true, done: false, due: addDays(TODAY, 3), author: "Astral", updated: addDays(TODAY, -6) },
    { id: uid++, title: "Reel dietro le quinte ogni martedì", body: "I contenuti backstage hanno il tasso di salvataggio più alto: 1 reel a settimana con la sessione del giorno.", cat: "Marketing", pinned: false, done: false, due: null, author: "Freya", updated: addDays(TODAY, -8) },
    { id: uid++, title: "Listino 2027", body: "Rivedere i prezzi di mix e master: siamo sotto la media della zona del 20%.", cat: "Crescita", pinned: false, done: false, due: addDays(TODAY, 30), author: "Plugghe", updated: addDays(TODAY, -12) },
    { id: uid++, title: "Cambiare corde al basso dello studio", body: "", cat: "Operativo", pinned: false, done: true, due: null, author: "Freya", updated: addDays(TODAY, -15) },
  ];
  return { tx, leads, artists, metrics, apps, notes };
}

// ─── state ──────────────────────────────────────────────────────────────────
const S = Object.assign(makeData(), {
  user: null,
  view: { finMonth: NOW.getMonth() + 1, finSource: "", crmStatus: "", noteCat: "", anaDate: addDays(TODAY, -1), chartMode: "pl", series: { income: true, expenses: true, profit: true } },
});

const ROUTES = [
  ["panoramica", "Panoramica"], ["finanza", "Finanza"], ["crm", "CRM"], ["artisti", "Artisti"],
  ["analytics", "Analytics"], ["insights", "Consigli & Insights"], ["integrazioni", "Integrazioni"],
];
const route = () => { const h = location.hash.slice(1); return ROUTES.some(([r]) => r === h) ? h : "panoramica"; };

// ─── derived data ───────────────────────────────────────────────────────────
function months() {
  return Array.from({ length: 12 }, (_, i) => {
    const pre = `${YEAR}-${String(i + 1).padStart(2, "0")}`;
    let income = 0, expenses = 0;
    for (const t of S.tx) if (t.date.startsWith(pre)) t.cents > 0 ? (income += t.cents) : (expenses -= t.cents);
    const profit = income - expenses;
    return { month: i + 1, income, expenses, profit, margin: income > 0 ? profit / income : null };
  });
}
const balances = () => S.tx.reduce((a, t) => (t.source === "cash" ? (a.cash += t.cents) : (a.bank += t.cents), (a.total += t.cents), a), { cash: 0, bank: 0, total: 0 });
function artistState(a) {
  const items = a.packages.filter((p) => !p.archived).flatMap((p) => p.items);
  const total = items.length, done = items.filter((i) => i.done).length, remaining = total - done;
  const upsell = total === 0 ? "nessun-pacchetto" : remaining === 0 ? "esaurito" : remaining <= Math.max(1, Math.ceil(total * 0.25)) ? "in-esaurimento" : "attivo";
  return { total, done, remaining, upsell };
}
const UPSELL_ORDER = { esaurito: 0, "in-esaurimento": 1, attivo: 2, "nessun-pacchetto": 3 };
const sortedArtists = () => S.artists.map((a) => ({ a, s: artistState(a) })).sort((x, y) => UPSELL_ORDER[x.s.upsell] - UPSELL_ORDER[y.s.upsell] || x.a.name.localeCompare(y.a.name));
const metric = (date, src, key) => S.metrics[date]?.[src]?.[key] ?? null;

// ─── UI atoms ───────────────────────────────────────────────────────────────
const pageHead = (eyebrow, title, intro, actions = "") => `
  <header class="page-head"><div>
    <div class="eyebrow">${eyebrow}</div>
    <h1 class="title-xl chrome-text" style="margin-top:8px">${title}</h1>
    ${intro ? `<p>${intro}</p>` : ""}
  </div>${actions ? `<div class="row-wrap">${actions}</div>` : ""}</header>`;
const stat = (label, value, sub = "") => `<div class="card stat"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
const empty = (glyph, title, body = "") => `<div class="empty"><div class="glyph" aria-hidden="true">${glyph}</div><h4>${title}</h4>${body ? `<div class="small">${body}</div>` : ""}</div>`;
function delta(cur, prev, invert = false) {
  if (prev === null || prev === 0) return "";
  const ch = (cur - prev) / Math.abs(prev), good = invert ? ch < 0 : ch > 0;
  return `<span class="${ch === 0 ? "" : good ? "delta-up" : "delta-down"}">${ch > 0 ? "▲" : ch < 0 ? "▼" : "•"} ${Math.abs(ch * 100).toFixed(1).replace(".", ",")}%</span>`;
}
function ring(value, total, size = 64) {
  const r = size / 2 - 5, c = 2 * Math.PI * r, pct = total ? value / total : 0;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${total - value} servizi rimasti su ${total}">
    <defs><linearGradient id="rc${size}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".35" stop-color="#8d939b"/><stop offset=".6" stop-color="#eef0f2"/><stop offset="1" stop-color="#a3a9b1"/></linearGradient></defs>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="url(#rc${size})" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c * pct} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
    <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" fill="#f5f5f7" font-size="${size / 4.2}" font-weight="650">${total - value}</text></svg>`;
}
function spark(values, dates, pct) {
  const nums = values.filter((v) => v !== null);
  if (nums.length < 2) return `<div class="xs faint" style="margin-top:10px;height:44px">Storico insufficiente per il trend</div>`;
  const W = 300, H = 44, min = Math.min(...nums), max = Math.max(...nums);
  const x = (i) => (i / (values.length - 1)) * W, y = (v) => H - 3 - ((v - min) / (max - min || 1)) * (H - 6);
  let d = "";
  values.forEach((v, i) => { if (v !== null) d += `${i > 0 && values[i - 1] !== null ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)} `; });
  return `<div class="spark-wrap" data-spark='${JSON.stringify({ values, dates, pct })}'>
    <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Andamento ultimi ${values.length} giorni">
      <path d="${d}" fill="none" stroke="#c9ced6" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
      <line class="cross" x1="0" x2="0" y1="0" y2="${H}" stroke="rgba(255,255,255,.25)" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/>
    </svg><div class="chart-tip" hidden></div></div>`;
}
const badge = (cls, text) => `<span class="badge ${cls}">${text}</span>`;
const select = (name, options, current, attrs = "") => `<select class="input" name="${name}" ${attrs}>${options.map((o) => `<option ${o === current ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;

// ─── screens ────────────────────────────────────────────────────────────────
function loginScreen() {
  return `<main class="login-wrap"><div class="login-orb" aria-hidden="true"></div>
    <div class="card login-card">
      <img src="${LOGO}" alt="Backrooms Studio" class="logo" style="height:96px;width:auto">
      <h1 class="title-l chrome-text" style="margin-bottom:6px">Hub dei soci</h1>
      <p class="muted small" style="margin:0 0 20px">Area riservata ai soci fondatori.</p>
      <div class="notice warn small" style="margin-bottom:16px">Demo con dati inventati · password: <strong>${DEMO_PASSWORD}</strong></div>
      <form data-form="login" class="stack" style="gap:16px;text-align:left">
        <div class="field"><span>Chi sta entrando?</span>
          <div class="segmented" style="width:100%">${PARTNERS.map((p, i) => `<label style="flex:1;text-align:center"><input type="radio" name="partner" value="${p}" ${i === 0 ? "checked" : ""}><span>${p}</span></label>`).join("")}</div>
        </div>
        <label class="field" for="pw"><span>Password</span><input id="pw" class="input" type="password" name="password" value="${DEMO_PASSWORD}" autocomplete="off"></label>
        <div id="login-error" class="notice critical" role="alert" hidden></div>
        <button class="btn btn-chrome" type="submit" style="height:42px;width:100%">Entra nell'hub</button>
      </form>
    </div></main>`;
}

function shell(content) {
  const r = route();
  return `<div class="demo-ribbon"><span><b>Demo</b> · dati inventati, le modifiche restano finché non ricarichi la pagina</span></div>
  <header class="topbar"><div class="topbar-inner">
    <a href="#panoramica" class="brand" aria-label="Backrooms Studio, panoramica"><span class="logo-lockup"><img src="${LOGO}" alt="" style="height:34px;width:auto"><span class="logo-word"><span class="chrome-text">BACKROOMS</span><small>STUDIO</small></span></span></a>
    <nav class="nav" aria-label="Sezioni">${ROUTES.map(([id, label]) => `<a href="#${id}" ${id === r ? 'aria-current="page"' : ""}>${label}</a>`).join("")}</nav>
    <div class="user-chip"><span class="avatar" aria-hidden="true">${S.user[0]}</span><span class="name">${S.user}</span><button class="btn btn-ghost btn-sm" data-action="logout">Esci</button></div>
  </div></header>
  <main class="shell">${content}</main>`;
}

function panoramica() {
  const ms = months(), m = NOW.getMonth(), cur = ms[m], prev = m > 0 ? ms[m - 1] : null, bal = balances();
  const art = sortedArtists(), up = art.filter((x) => x.s.upsell === "esaurito" || x.s.upsell === "in-esaurimento");
  const newLeads = S.leads.filter((l) => l.status === "nuovo").length;
  const pri = S.notes.filter((n) => !n.done && (n.pinned || n.due)).slice(0, 4);
  const md = addDays(TODAY, -1);
  const h = NOW.getHours(), greet = h < 12 ? "Buongiorno" : h < 18 ? "Buon pomeriggio" : "Buonasera";
  return pageHead(NOW.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" }), `${greet}, ${S.user}.`, "Lo stato dello studio in un colpo d'occhio: cassa, artisti da seguire, crescita e priorità del team.") + `
  <div class="grid cols-4">
    ${stat(`Entrate ${MONTHS[m]}`, fmtEur(cur.income), prev ? delta(cur.income, prev.income) : "")}
    ${stat(`Uscite ${MONTHS[m]}`, fmtEur(cur.expenses), prev ? delta(cur.expenses, prev.expenses, true) : "")}
    ${stat(`Utile ${MONTHS[m]}`, fmtEur(cur.profit), cur.margin === null ? "Nessuna entrata" : `Margine ${fmtPct(cur.margin)}`)}
    ${stat("Liquidità totale", fmtEur(bal.total), `Banca ${fmtEur(bal.bank)} · Contanti ${fmtEur(bal.cash)}`)}
  </div>
  <div class="grid cols-3 mt">
    <section class="card span-2"><div class="card-head"><h3>Opportunità di upsell</h3><a class="btn btn-sm" href="#artisti">Tutti gli artisti</a></div>
      ${up.length === 0 ? empty("✓", "Nessun pacchetto in esaurimento", "Quando un artista sta per finire i servizi acquistati, comparirà qui.") : `<div class="stack">${up.map(({ a, s }) => `
        <a href="#artisti" class="upsell-banner ${s.upsell === "esaurito" ? "" : "soon"}">${ring(s.done, s.total, 40)}
          <div class="grow"><div style="font-weight:600">${esc(a.name)}</div><div class="xs muted">${s.upsell === "esaurito" ? "Pacchetto esaurito, proponi un nuovo pacchetto" : `${s.remaining} ${s.remaining === 1 ? "servizio rimasto" : "servizi rimasti"} su ${s.total}`}</div></div>
          ${badge(s.upsell === "esaurito" ? "critical" : "warn", s.upsell === "esaurito" ? "Esaurito" : "In esaurimento")}</a>`).join("")}</div>`}
    </section>
    <section class="card"><div class="card-head"><h3>Pipeline</h3><a class="btn btn-sm" href="#crm">Apri CRM</a></div>
      <div class="stat"><div class="value">${newLeads}</div><div class="sub">nuovi contatti da gestire</div></div>

  const pre = `${YEAR}-${String(v.finMonth).padStart(2, "0")}`;
  const txs = S.tx.filter((t) => t.date.startsWith(pre) && (!v.finSource || t.source === v.finSource)).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  const cats = Object.values(S.tx.filter((t) => t.date.startsWith(pre)).reduce((acc, t) => ((acc[t.cat] ??= { cat: t.cat, total: 0, n: 0 }), (acc[t.cat].total += t.cents), acc[t.cat].n++, acc), {})).sort((a, b) => Math.abs(b.total) - Math.abs(a.total));
  const maxCat = Math.max(1, ...cats.map((c) => Math.abs(c.total)));
  const SRC = { bank: "Banca", cash: "Contanti", import: "Estratto CSV" };

    ${stat(`Entrate ${YEAR}`, fmtEur(tot.income))}${stat(`Uscite ${YEAR}`, fmtEur(tot.expenses))}

        : `<div class="legend"><span><i style="background:linear-gradient(#fff,#8d939b)"></i>Saldo progressivo dell'anno</span></div>`}
    </div>
    <div class="chart3d" id="chart3d" role="img" aria-label="Grafico 3D mensile di entrate, uscite e utile; i valori sono anche nella tabella del conto economico."><div class="empty" style="position:absolute;inset:0;display:grid;place-content:center"><span class="faint small">Caricamento grafico 3D…</span></div></div>
    <div class="xs faint" style="margin-top:8px">Trascina per ruotare · passa sopra un mese per i dettagli</div>
  </section>
  <div class="grid cols-3 mt">

          <td><div style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(t.desc)}">${esc(t.desc)}</div><div class="xs faint">${SRC[t.source]}${t.by ? ` · ${t.by}` : ""}</div></td>
          <td>${select("cat", [...new Set([...(t.cents > 0 ? CAT_IN : CAT_OUT), t.cat])], t.cat, `data-change="tx-cat" data-id="${t.id}" aria-label="Categoria" style="height:30px;font-size:12.5px;min-width:130px"`)}</td>
          <td class="right num ${t.cents > 0 ? "amount-in" : "amount-out"}" style="font-weight:600;white-space:nowrap">${t.cents > 0 ? "+" : "−"}${fmtEur(Math.abs(t.cents))}</td>
          <td class="right">${t.source !== "bank" ? `<button class="btn btn-ghost btn-sm btn-danger" data-action="tx-del" data-id="${t.id}" aria-label="Elimina movimento">✕</button>` : ""}</td></tr>`).join("")}
      </tbody></table></div>`}</section>
    <div class="stack" style="gap:16px">
      <section class="card"><div class="card-head"><h3>Per categoria · ${MONTHS[v.finMonth - 1]}</h3></div>
        ${cats.length === 0 ? `<div class="small faint">Nessun dato.</div>` : `<div class="stack small">${cats.map((c) => `<div><div class="row between"><span>${c.cat} <span class="faint xs">(${c.n})</span></span><span class="num ${c.total < 0 ? "" : "amount-in"}">${fmtEur(c.total)}</span></div>
          <div class="meter" style="margin-top:6px"><i style="width:${(Math.abs(c.total) / maxCat) * 100}%;background:${c.total < 0 ? "var(--series-expense)" : "var(--series-income)"}"></i></div></div>`).join("")}</div>`}</section>
      <section class="card"><div class="card-head"><h3>Conto bancario</h3></div>
        <div class="small muted">Nella versione reale qui si importa l'estratto conto CSV dell'home banking: i movimenti già presenti vengono saltati.</div></section>
    </div>
  </div>`;
}

  const count = (s) => S.leads.filter((l) => l.status === s).length;
  const BADGE = { nuovo: "info", contattato: "plain", "in trattativa": "warn", convertito: "good", perso: "critical" };

          <td class="small">${l.email ? `<div>${esc(l.email)}</div>` : ""}${l.phone ? `<div class="muted">${esc(l.phone)}</div>` : ""}${l.ig ? `<div class="muted">@${esc(l.ig.replace(/^@/, ""))}</div>` : ""}</td>

function artisti() {
  const list = sortedArtists(), n = (s) => list.filter((x) => x.s.upsell === s).length;
  const COPY = {
    esaurito: ["critical", "Pacchetto esaurito", "Tutti i servizi sono stati erogati: è il momento di proporre un nuovo pacchetto."],
    "in-esaurimento": ["warn", "In esaurimento", "Mancano pochi servizi: prepara la proposta per il prossimo pacchetto."],
    attivo: ["good", "Attivo", ""], "nessun-pacchetto": ["plain", "Nessun pacchetto", ""],
  };
  return pageHead("Pacchetti & upsell", "Artisti", "Ogni artista con i servizi acquistati. Spunta ciò che viene completato in studio: l'hub segnala quando proporre il pacchetto successivo.") + `
  <div class="grid cols-4">${stat("Artisti", list.length)}${stat("Pacchetti attivi", n("attivo") + n("in-esaurimento"))}${stat("Da proporre subito", `<span class="${n("esaurito") ? "delta-down" : ""}">${n("esaurito")}</span>`, "pacchetti esauriti")}${stat("In esaurimento", n("in-esaurimento"), "≤ 25% dei servizi rimasti")}</div>
  <div class="grid cols-3 mt" style="align-items:start">
    <div class="span-2 stack" style="gap:16px">${list.length === 0 ? `<section class="card">${empty("♪", "Nessun artista ancora")}</section>` : list.map(({ a, s }) => {
      const [bcls, blabel, hint] = COPY[s.upsell];
      const active = a.packages.filter((p) => !p.archived), archived = a.packages.filter((p) => p.archived);
      const contacts = [a.email, a.phone, a.ig].filter(Boolean).map(esc).join(" · ");
      return `<section id="artista-${a.id}" class="card ${s.upsell === "esaurito" ? "upsell-card" : s.upsell === "in-esaurimento" ? "upsell-card soon" : ""}">
        <div class="row" style="gap:16px;align-items:flex-start">${ring(s.done, s.total, 64)}
          <div class="grow"><div class="row-wrap between"><h2 class="title-l">${esc(a.name)}</h2>${badge(bcls, blabel)}</div>
            <div class="small muted" style="margin-top:4px">${s.total ? `${s.done} di ${s.total} servizi completati · ${s.remaining} rimanenti` : "Nessun servizio attivo"}${contacts ? `<span class="faint"> · ${contacts}</span>` : ""}</div>
            ${s.total ? `<div class="meter" style="margin-top:10px"><i style="width:${(s.done / s.total) * 100}%"></i></div>` : ""}</div></div>
        ${hint ? `<div class="upsell-banner mt ${s.upsell === "esaurito" ? "" : "soon"}"><span aria-hidden="true">${s.upsell === "esaurito" ? "●" : "◐"}</span><span class="grow">${hint}</span><button class="btn btn-sm btn-chrome" data-action="open-pkg" data-id="${a.id}">Proponi pacchetto</button></div>` : ""}
        ${active.map((p) => { const d = p.items.filter((i) => i.done).length; return `<div class="mt">
          <div class="row-wrap between" style="margin-bottom:10px"><div><div class="title-m">${esc(p.name)}</div><div class="xs faint">Acquistato il ${fmtDate(p.purchased)}${p.price ? ` · ${fmtEur(p.price)}` : ""} · ${d}/${p.items.length} completati</div></div>
            <div class="row" style="gap:4px"><button class="btn btn-ghost btn-sm" data-action="pkg-archive" data-id="${p.id}">Archivia</button></div></div>
          <div class="checklist">${p.items.map((it) => `<button type="button" class="check ${it.done ? "done" : ""}" role="checkbox" aria-checked="${it.done}" data-action="item-toggle" data-id="${it.id}" title="${it.done ? `Completato ${fmtDate(it.at)} da ${it.by}` : "Segna come completato"}"><span class="box" aria-hidden="true"></span><span class="label grow">${esc(it.service)}</span></button>`).join("")}</div></div>`; }).join("")}
        ${archived.length ? `<details class="disclosure mt"><summary class="small muted"><span class="chev">›</span> Storico pacchetti (${archived.length})</summary><div class="stack mt small">${archived.map((p) => `<div class="row between"><span>${esc(p.name)} <span class="faint">· ${fmtDate(p.purchased)} · ${p.items.filter((i) => i.done).length}/${p.items.length}</span></span><button class="btn btn-ghost btn-sm" data-action="pkg-restore" data-id="${p.id}">Ripristina</button></div>`).join("")}</div></details>` : ""}
        <details class="disclosure mt" id="pkg-${a.id}"><summary class="small muted"><span class="chev">›</span> Assegna nuovo pacchetto</summary>
          <form data-form="package" data-id="${a.id}" class="stack mt">
            <div class="row-wrap"><span class="xs faint">Preset:</span>${PRESETS.map((p, i) => `<button type="button" class="btn btn-sm" data-action="preset" data-i="${i}">${p.name}</button>`).join("")}</div>
            <div class="form-grid"><label class="field"><span>Nome pacchetto</span><input class="input" name="name" placeholder="Pacchetto personalizzato"></label><label class="field"><span>Prezzo (€)</span><input class="input num" name="price" inputmode="decimal" placeholder="0"></label></div>
            <div class="checklist">${SERVICES.map((sv) => `<label class="check" style="cursor:default"><span class="label grow">${sv}</span><input class="input num" type="number" min="0" max="50" name="qty:${sv}" value="0" style="width:62px;height:30px;text-align:center" aria-label="Quantità ${sv}"></label>`).join("")}</div>
            <button class="btn btn-chrome" type="submit">Assegna pacchetto</button>
          </form></details>
      </section>`; }).join("")}</div>
    <section class="card"><div class="card-head"><h3>Nuovo artista</h3></div>
      <form data-form="artist" class="stack">
        <label class="field" for="a-name"><span>Nome / nome d'arte *</span><input id="a-name" class="input" name="name" required></label>
        <label class="field" for="a-email"><span>Email</span><input id="a-email" class="input" type="email" name="email"></label>
        <div class="form-grid"><label class="field" for="a-phone"><span>Telefono</span><input id="a-phone" class="input" name="phone"></label><label class="field" for="a-ig"><span>Instagram</span><input id="a-ig" class="input" name="ig"></label></div>
        <button class="btn btn-chrome" type="submit">Aggiungi artista</button>
      </form></section>
  </div>`;
}

const METRIC_DEFS = {

};
function analytics() {
  const date = S.view.anaDate, prev = addDays(date, -1), DAYS = 30;

  return pageHead("Report giornaliero", "Analytics", `Social e sito web del ${fmtDate(date)}, con il confronto sul giorno precedente e il trend degli ultimi ${DAYS} giorni.`,
    `<input class="input" type="date" id="ana-date" data-change="ana-date" value="${date}" max="${addDays(TODAY, -1)}" min="${addDays(TODAY, -60)}" style="width:170px" aria-label="Giorno del report">`) + `
  <div class="stack-l">${sources.map(([id, name, blurb]) => {
    const f = metric(date, id, "followers"), fp = metric(prev, id, "followers");
    return `<section><div class="row-wrap between" style="margin-bottom:12px"><div><h2 class="title-l">${name}</h2><div class="small muted">${blurb}</div></div>
      <div class="row-wrap">${f !== null && fp !== null ? badge(f - fp >= 0 ? "good" : "critical", `${f - fp >= 0 ? "+" : ""}${fmtNum(f - fp)} follower nel giorno`) : ""}${badge("plain", "Sync automatico ore 6:00")}</div></div>
      <div class="grid cols-4">${METRIC_DEFS[id].map(([k, label, pct]) => {
        const val = metric(date, id, k), p = metric(prev, id, k);
        return `<div class="card stat"><div class="label">${label}</div><div class="value">${val === null ? `<span class="faint">—</span>` : pct ? fmtPct(val) : fmtNum(val)}</div>
          <div class="sub">${val === null ? "Nessun dato per questo giorno" : `${delta(val, p)}${p ? `<span class="faint"> vs giorno prima</span>` : ""}`}</div>
          ${spark(dates.map((d) => metric(d, id, k)), dates, !!pct)}</div>`;
      }).join("")}</div></section>`;
  }).join("")}
    <section class="card flush"><div class="card-head" style="padding:20px 22px 0"><h3>Ultime candidature dal sito</h3></div>
      <div class="table-wrap" style="margin-top:8px"><table class="table"><thead><tr><th>Ricevuta</th><th>Nome</th><th>Tipo</th><th>Messaggio</th></tr></thead><tbody>
      ${S.apps.map((a) => `<tr><td class="muted num" style="white-space:nowrap">${fmtDate(a.at)}</td><td><div style="font-weight:600">${esc(a.name)}</div><div class="xs faint">${esc(a.email)}</div></td><td>${badge(a.kind === "prenotazione" ? "info" : "plain", a.kind)}</td><td class="small muted">${esc(a.message)}</td></tr>`).join("")}
      </tbody></table></div></section>
  </div>`;
}

function insights() {
  const cat = S.view.noteCat;
  const list = S.notes.filter((n) => !cat || n.cat === cat).sort((a, b) => a.done - b.done || b.pinned - a.pinned || (a.due ?? "9999").localeCompare(b.due ?? "9999") || b.updated.localeCompare(a.updated));
  return pageHead("Visione condivisa", "Consigli & Insights", "Linee guida strategiche, idee di crescita e promemoria operativi dei tre soci. Fissa in alto ciò che conta.",
    `<div class="segmented"><button type="button" data-action="note-cat" data-v="" aria-current="${!cat}">Tutto</button>${NOTE_CATS.map((c) => `<button type="button" data-action="note-cat" data-v="${c}" aria-current="${cat === c}">${c}</button>`).join("")}</div>`) + `
  <div class="grid cols-3" style="align-items:start">
    <div class="span-2">${list.length === 0 ? `<section class="card">${empty("✦", "Nessuna nota in questa categoria")}</section>` : `<div class="grid cols-2">${list.map((n) => `
      <article class="card note-card ${n.pinned ? "pinned" : ""} ${n.done ? "is-done" : ""}">
        <div class="row between">${badge("plain", n.cat)}<div class="row" style="gap:2px">
          <button class="btn btn-ghost btn-sm" data-action="note-pin" data-id="${n.id}" aria-pressed="${n.pinned}" title="${n.pinned ? "Togli da in evidenza" : "Metti in evidenza"}">${n.pinned ? "★" : "☆"}</button>
          <button class="btn btn-ghost btn-sm" data-action="note-done" data-id="${n.id}" title="${n.done ? "Riapri" : "Segna come fatto"}">${n.done ? "↺" : "✓"}</button>
          <button class="btn btn-ghost btn-sm btn-danger" data-action="note-del" data-id="${n.id}" aria-label="Elimina nota">✕</button></div></div>
        <h3 class="title-m">${esc(n.title)}</h3>${n.body ? `<div class="body">${esc(n.body)}</div>` : ""}
        <div class="row between xs faint" style="margin-top:auto"><span>${n.author} · ${fmtDate(n.updated)}</span>${n.due ? `<span class="${!n.done && n.due < TODAY ? "delta-down" : ""}">Scadenza ${fmtDate(n.due)}</span>` : ""}</div>
      </article>`).join("")}</div>`}</div>
    <section class="card"><div class="card-head"><h3>Nuova nota</h3></div>
      <form data-form="note" class="stack">
        <label class="field" for="n-title"><span>Titolo *</span><input id="n-title" class="input" name="title" required placeholder="Es. Open day per artisti emergenti"></label>
        <label class="field" for="n-body"><span>Dettagli</span><textarea id="n-body" class="input" name="body" rows="5" placeholder="Contesto, obiettivo, prossimi passi…"></textarea></label>
        <div class="form-grid"><label class="field" for="n-cat"><span>Categoria</span>${select("cat", NOTE_CATS, cat || "Strategia", 'id="n-cat"')}</label><label class="field" for="n-due"><span>Scadenza</span><input id="n-due" class="input" type="date" name="due"></label></div>
        <button class="btn btn-chrome" type="submit">Aggiungi alla bacheca</button>
      </form></section>
  </div>`;
}

function integrazioni() {
  const card = (title, status, cls, body) => `<section class="card"><div class="card-head"><h3>${title}</h3>${badge(cls, status)}</div><p class="small muted" style="margin-top:-6px">${body}</p></section>`;
  return pageHead("Connessioni", "Integrazioni", "Stato delle sorgenti dati collegate all'hub. Nella demo sono simulate; nella versione reale si configurano sul PC dello studio.") + `
  <div class="grid cols-2">
    ${card("Conto bancario aziendale", "Import CSV", "info", "L'estratto conto dell'home banking si carica in Finanza: categorie automatiche, nessun doppione se ricarichi un periodo già importato.")}
    ${card("Google Drive · anagrafiche clienti", "Collegato", "good", "Legge i fogli clienti nella cartella “Backrooms – CRM” e li porta nel CRM ogni mattina.")}
    ${card("Instagram", "Collegato", "good", "Visualizzazioni, account raggiunti, follower, interazioni, salvataggi e condivisioni, ogni giorno.")}
    ${card("TikTok", "In revisione", "warn", "Collegamento in attesa dell'approvazione di TikTok: nel frattempo i numeri si inseriscono a mano.")}
    ${card("Sito web · Google Analytics 4", "Collegato", "good", "Visitatori unici, sessioni, tasso di interazione e clic sul sito.")}
    ${card("Candidature dal sito", "Attivo", "good", "Ogni richiesta dal form del sito arriva nel report giornaliero e nel CRM come nuovo contatto.")}
  </div>
  <section class="card mt"><div class="card-head"><h3>Automazione giornaliera</h3></div><div class="small muted">Ogni giorno alle 6:00 l'hub aggiorna Drive, social e sito con i dati del giorno precedente.</div></section>`;
}

const SCREENS = { panoramica, finanza, crm, artisti, analytics, insights, integrazioni };

// ─── render loop ────────────────────────────────────────────────────────────
const app = document.getElementById("app");
let lastRoute = null;
function render() {
  disposeChart();
  if (!S.user) { app.innerHTML = loginScreen(); return; }
  const r = route(), y = r === lastRoute ? window.scrollY : 0;
  app.innerHTML = shell(SCREENS[r]());
  window.scrollTo(0, y);
  lastRoute = r;
  if (r === "finanza") mountChart();
}
window.addEventListener("hashchange", render);

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 2600);
}
const findItem = (id) => { for (const a of S.artists) for (const p of a.packages) { const it = p.items.find((i) => i.id === id); if (it) return it; } };
const findPkg = (id) => { for (const a of S.artists) { const p = a.packages.find((x) => x.id === id); if (p) return p; } };

// ─── events ─────────────────────────────────────────────────────────────────
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action, id = Number(el.dataset.id), v = el.dataset.v, V = S.view;
  switch (a) {
    case "logout": S.user = null; location.hash = ""; break;
    case "fin-source": V.finSource = v; break;
    case "fin-month": V.finMonth = Number(v); break;
    case "chart-mode": V.chartMode = v; break;
    case "series": V.series[v] = !V.series[v]; if (!Object.values(V.series).some(Boolean)) V.series[v] = true; break;
    case "bank-sync": toast("Nella demo la banca non è collegata: nella versione reale importi l'estratto conto CSV."); return;
    case "drive-sync": toast("Drive sincronizzato: nessun nuovo contatto."); return;
    case "tx-del": S.tx = S.tx.filter((t) => t.id !== id); toast("Movimento eliminato."); break;
    case "crm-status": V.crmStatus = v; break;
    case "lead-del": S.leads = S.leads.filter((l) => l.id !== id); toast("Contatto eliminato."); break;
    case "lead-convert": {
      const l = S.leads.find((x) => x.id === id); l.status = "convertito";
      const art = { id: uid++, name: l.name, email: l.email, phone: l.phone, ig: l.ig ? `@${l.ig.replace(/^@/, "")}` : "", packages: [] };
      S.artists.push(art); toast(`${l.name} è ora un artista: assegnagli un pacchetto.`);
      location.hash = "artisti"; setTimeout(() => { const d = document.getElementById(`pkg-${art.id}`); if (d) { d.open = true; d.scrollIntoView({ behavior: "smooth", block: "center" }); } }, 50);
      return;
    }
    case "item-toggle": { const it = findItem(id); it.done = !it.done; it.by = it.done ? S.user : ""; it.at = it.done ? TODAY : ""; break; }
    case "pkg-archive": findPkg(id).archived = true; break;
    case "pkg-restore": findPkg(id).archived = false; break;
    case "open-pkg": { const d = document.getElementById(`pkg-${id}`); d.open = true; d.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    case "preset": {
      const p = PRESETS[Number(el.dataset.i)], f = el.closest("form");
      f.elements.name.value = p.name; f.elements.price.value = p.price;
      SERVICES.forEach((sv) => (f.elements[`qty:${sv}`].value = p.items.find(([s]) => s === sv)?.[1] ?? 0));
      return;
    }
    case "note-cat": V.noteCat = v; break;
    case "note-pin": { const n = S.notes.find((x) => x.id === id); n.pinned = !n.pinned; break; }
    case "note-done": { const n = S.notes.find((x) => x.id === id); n.done = !n.done; break; }
    case "note-del": S.notes = S.notes.filter((n) => n.id !== id); toast("Nota eliminata."); break;
    default: return;
  }
  render();
});

document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-change]");
  if (!el) return;
  const id = Number(el.dataset.id);
  if (el.dataset.change === "tx-cat") { S.tx.find((t) => t.id === id).cat = el.value; toast("Categoria aggiornata."); }
  if (el.dataset.change === "lead-status") S.leads.find((l) => l.id === id).status = el.value;
  if (el.dataset.change === "ana-date" && el.value) S.view.anaDate = el.value < addDays(TODAY, -60) ? addDays(TODAY, -60) : el.value > addDays(TODAY, -1) ? addDays(TODAY, -1) : el.value;
  render();
});

document.addEventListener("submit", (e) => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  switch (f.dataset.form) {
    case "login":
      if (d.password !== DEMO_PASSWORD) { const err = document.getElementById("login-error"); err.textContent = "Password non corretta."; err.hidden = false; return; }
      S.user = d.partner; if (!location.hash) location.hash = "panoramica"; break;
    case "cash": {
      const c = parseEuro(d.amount);
      if (!c || c <= 0) return toast("Inserisci un importo valido.");
      const out = d.dir === "out";
      S.tx.push({ id: uid++, date: d.date || TODAY, cents: out ? -c : c, desc: d.desc, cat: d.cat, source: "cash", by: S.user });
      S.view.finMonth = Number((d.date || TODAY).slice(5, 7));
      toast(`${out ? "Uscita" : "Entrata"} in contanti registrata: guarda il grafico.`); break;
    }
    case "lead": S.leads.push({ id: uid++, name: d.name, email: d.email, phone: d.phone, ig: d.ig, genre: d.genre, notes: d.notes, source: "manuale", status: "nuovo", created: TODAY }); toast(`${d.name} aggiunto alla pipeline.`); break;
    case "artist": S.artists.push({ id: uid++, name: d.name, email: d.email, phone: d.phone, ig: d.ig, packages: [] }); toast(`${d.name} aggiunto.`); break;
    case "package": {
      const items = [];
      SERVICES.forEach((sv) => { const q = Math.min(50, Math.max(0, Number(d[`qty:${sv}`]) || 0)); for (let i = 0; i < q; i++) items.push({ id: uid++, service: q > 1 ? `${sv} ${i + 1}/${q}` : sv, done: false, by: "", at: "" }); });
      if (!items.length) return toast("Aggiungi almeno un servizio al pacchetto.");
      const a = S.artists.find((x) => x.id === Number(f.dataset.id));
      a.packages.forEach((p) => { if (p.items.every((i) => i.done)) p.archived = true; });
      a.packages.unshift({ id: uid++, name: d.name || "Pacchetto personalizzato", price: Math.max(0, parseEuro(d.price || "0") ?? 0), purchased: TODAY, archived: false, items });
      toast(`Pacchetto assegnato a ${a.name}.`); break;
    }
    case "note": S.notes.push({ id: uid++, title: d.title, body: d.body, cat: d.cat, pinned: false, done: false, due: d.due || null, author: S.user, updated: TODAY }); toast("Nota aggiunta alla bacheca."); break;
  }
  render();
});

// sparkline crosshair + tooltip
document.addEventListener("pointermove", (e) => {
  document.querySelectorAll(".spark-wrap.on").forEach((w) => { if (!w.contains(e.target)) { w.classList.remove("on"); w.querySelector(".chart-tip").hidden = true; w.querySelector(".cross").setAttribute("visibility", "hidden"); } });
  const w = e.target.closest?.(".spark-wrap");
  if (!w) return;
  const { values, dates, pct } = JSON.parse(w.dataset.spark), svg = w.querySelector("svg"), r = svg.getBoundingClientRect();
  const i = Math.max(0, Math.min(values.length - 1, Math.round(((e.clientX - r.left) / r.width) * (values.length - 1))));
  const cross = w.querySelector(".cross"), x = (i / (values.length - 1)) * 300;
  cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
  const tip = w.querySelector(".chart-tip"), v = values[i];
  tip.innerHTML = `<div class="faint xs">${new Date(`${dates[i]}T12:00:00`).toLocaleDateString("it-IT", { day: "numeric", month: "short" })}</div><div class="num" style="font-weight:600">${v === null ? "nessun dato" : pct ? fmtPct(v) : fmtNum(v)}</div>`;
  tip.style.left = `${(i / (values.length - 1)) * 100}%`;
  tip.style.transform = `translateX(${i > values.length / 2 ? "-100%" : "0"})`;
  tip.hidden = false; w.classList.add("on");
});

// ─── 3D chart (three.js, loaded on demand) ──────────────────────────────────
let chart = null;
function disposeChart() { if (chart) { chart.dispose(); chart = null; } }
// The chart module (below) resolves this once three.js has loaded from the CDN.
const chartModule = new Promise((resolve, reject) => {
  window.__chartReady = resolve;
  setTimeout(() => reject(new Error("three.js non caricato")), 20000);
});
async function mountChart() {
  const host = document.getElementById("chart3d");
  try {
    const createChart = await chartModule;
    if (document.getElementById("chart3d") !== host) return; // navigated away meanwhile
    chart = createChart(host, { months: months(), mode: S.view.chartMode, series: { ...S.view.series }, fmtEur, fmtPct, MONTHS });
  } catch (err) {
    host.innerHTML = `<div class="empty" style="position:absolute;inset:0;display:grid;place-content:center"><h4>Grafico 3D non disponibile</h4><div class="small">Il browser non è riuscito a caricare il motore 3D. I valori sono nella tabella del conto economico.</div></div>`;
    console.error(err);
  }
}

render();
</script>
