<script>
/* ═══════════════════════════════════════════════════════════════════════════

const LOGO = "data:image/png;base64,__LOGO_B64__";

// ─── formatting ─────────────────────────────────────────────────────────────

const fmtEur = (c) => eurF.format(c / 100);

const fmtPct = (n) => `${(n * 100).toFixed(1).replace(".", ",")}%`;

const parseEuro = (s) => { let t = String(s).trim().replace(/[€\s]/g, ""); if (t.includes(",")) t = t.replace(/\./g, "").replace(",", "."); const n = Number(t); return Number.isFinite(n) ? Math.round(n * 100) : null; };

const NOW = new Date();

// ─── demo data (deterministic) ──────────────────────────────────────────────
let seed = 42;
const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
let uid = 1;

const CAT_IN = ["Sessioni", "Mix & Master", "Produzioni", "Pacchetti", "Beat", "Altro"];

function makeData() {

  }

  const leads = [
    ["Nova Kid", "nova.kid@example.com", "+39 333 120 4455", "novakid", "Trap", "Cerca un EP da 5 tracce entro marzo", "drive", "nuovo", "Instagram", "Plugghe", "Chiamare per il preventivo EP", -1, null, -12],

    ["Gemma Rossi", "gemma@example.com", "+39 347 880 1200", "", "Pop", "Singolo + videoclip, budget 900 €", "manuale", "in trattativa", "Passaparola", "Astral", "", null, -10, -20],
    ["Sabbia", "sabbia.band@example.com", "", "sabbiaband", "Indie", "Band di 4, registrazione live", "drive", "nuovo", "TikTok", "", "", null, null, -2],

  ].map(([name, email, phone, ig, genre, notes, source, status, channel, ref, next, nextOff, lastOff, createdOff]) => ({

  const pkg = (name, price, list, done, daysAgo, dueOff, pays) => {
    const items = [];

  };
  const trk = (title, stage, revs, dueOff) => ({ id: uid++, title, stage, revs, due: dueOff === null ? null : addDays(TODAY, dueOff), url: "" });
  const artists = [
    { id: uid++, name: "Kaos Melodico", email: "kaos@example.com", phone: "", ig: "@kaosmelodico", channel: "Instagram", ref: "Plugghe",
      packages: [pkg("EP Pack", 1500, [["Registrazione", 5], ["Mix", 5], ["Master", 5]], 13, 60, -5, [[600, "bonifico", -60], [400, "bonifico", -25]])],
      tracks: [trk("Notte fonda", 4, 2, null), trk("Cemento", 3, 3, 4), trk("Luce blu", 2, 1, 9), trk("Fuori", 1, 0, 15), trk("Outro", 0, 0, 20)] },
    { id: uid++, name: "Aria Blu", email: "aria@example.com", phone: "", ig: "@ariablu", channel: "TikTok", ref: "Freya",
      packages: [pkg("Singolo Completo", 350, [["Registrazione", 1], ["Mix", 1], ["Master", 1]], 3, 20, -10, [[350, "contanti", -20]])],
      tracks: [trk("Polvere", 4, 1, null)] },
    { id: uid++, name: "Dr. Bassi", email: "", phone: "+39 340 555 0192", ig: "@drbassi", channel: "Passaparola", ref: "Astral",
      packages: [pkg("Vocal Sessions x4", 280, [["Sessione vocale", 4]], 1, 10, 20, [[140, "pos", -10]])], tracks: [] },
    { id: uid++, name: "Lunaria", email: "lunaria@example.com", phone: "", ig: "@lunaria", channel: "Sito web", ref: "Plugghe",
      packages: [pkg("Produzione + Singolo", 600, [["Produzione", 1], ["Registrazione", 1], ["Mix", 1], ["Master", 1]], 2, 14, 10, [[300, "bonifico", -14]])],
      tracks: [trk("Marea", 2, 2, 6)] },
  ];

  // agenda: last 8 weeks + next 10 days, no overlaps in the same room
  const sessions = [];
  const SLOTS = [["10:00", "13:00"], ["14:00", "17:00"], ["15:00", "18:00"], ["18:00", "21:00"], ["19:00", "22:00"]];
  for (let off = -56; off <= 10; off++) {
    const date = addDays(TODAY, off), dow = new Date(`${date}T12:00:00`).getDay();
    if (dow === 0) continue;
    const n = Math.floor(rand() * 3) + (dow >= 4 ? 1 : 0);
    for (let k = 0; k < n; k++) {
      const [start, end] = dow >= 4 && rand() < 0.6 ? SLOTS[3 + Math.floor(rand() * 2)] : SLOTS[Math.floor(rand() * SLOTS.length)];
      const room = rand() < 0.65 ? "Sala A" : "Sala B";
      if (sessions.some((x) => x.date === date && x.room === room && x.start < end && x.end > start)) continue;
      const a = artists[Math.floor(rand() * artists.length)];
      sessions.push({ id: uid++, date, start, end, room, engineer: PARTNERS[Math.floor(rand() * 3)], artistId: a.id, itemId: null, title: "", status: off < 0 ? (rand() < 0.08 ? "annullata" : "completata") : "prenotata" });
    }
  }
  const openDay = (o) => { while (new Date(`${addDays(TODAY, o)}T12:00:00`).getDay() === 0) o++; return addDays(TODAY, o); };
  const free = (date, room, start, end) => !sessions.some((x) => x.date === date && x.room === room && x.status !== "annullata" && x.start < end && x.end > start);
  const linkSession = (a, itemIdx, off, room, start, end, eng) => {
    const date = openDay(off), it = a.packages[0].items[itemIdx];
    if (free(date, room, start, end)) sessions.push({ id: uid++, date, start, end, room, engineer: eng, artistId: a.id, itemId: it.id, title: "", status: "prenotata" });
  };
  linkSession(artists[2], 1, 1, "Sala A", "10:00", "13:00", "Freya");
  linkSession(artists[3], 2, 3, "Sala B", "11:00", "14:00", "Plugghe");

  const equipment = [
    ["Neumann U87 Ai", "Microfoni", -700, 3200, 8, 30, 12, -370, "Matricola demo"],
    ["Universal Audio Apollo x8", "Computer & interfacce", -420, 2900, 5, 310, null, null, ""],
    ["Genelec 8040B (coppia)", "Monitor & cuffie", -900, 1800, 7, null, null, null, ""],
    ["Neve 1073 DPX", "Preamp & outboard", -300, 3800, 8, 400, 24, null, ""],
    ["Pannelli acustici sala A", "Arredo & acustica", -1000, 1500, 10, null, null, null, ""],
    ["Mac Studio M2", "Computer & interfacce", -500, 2600, 4, 45, 6, -200, "Pulizia e backup ogni 6 mesi"],
  ].map(([name, cat, bought, eur, life, warr, every, last, notes]) => ({ id: uid++, name, cat, purchase: addDays(TODAY, bought), cents: eur * 100, life, warranty: warr === null ? null : addDays(TODAY, warr), every, last: last === null ? null : addDays(TODAY, last), notes }));

  const moves = [];
  const MN = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
  for (let m = 0; m < NOW.getMonth(); m++) PARTNERS.forEach((p, i) => moves.push({ id: uid++, date: iso(new Date(YEAR, m, 28, 12)), partner: p, kind: "prelievo", cents: 35000 + i * 5000, note: `Compenso ${MN[m]}` }));
  moves.push({ id: uid++, date: iso(new Date(YEAR, 0, 10, 12)), partner: "Plugghe", kind: "versamento", cents: 150000, note: "Contributo acquisto Neve 1073" });

  const metrics = {};
  let igF = 4200, ttF = 9800;
  for (let d = 60; d >= 1; d--) {
    const date = addDays(TODAY, -d);
    igF += Math.round(rand() * 25 - 3);
    ttF += Math.round(rand() * 60 - 8);
    const igV = Math.round(2500 + rand() * 4000), ttV = Math.round(5000 + rand() * 15000), users = Math.round(80 + rand() * 140);
    metrics[date] = {
      instagram: { views: igV, reach: Math.round(igV * (0.45 + rand() * 0.2)), followers: igF, interactions: Math.round(igV * (0.03 + rand() * 0.03)), saves: Math.round(10 + rand() * 40), shares: Math.round(5 + rand() * 30) },
      tiktok: { views: ttV, followers: ttF, interactions: Math.round(ttV * (0.04 + rand() * 0.04)), shares: Math.round(20 + rand() * 80), comments: Math.round(15 + rand() * 60) },
      web: { users, sessions: Math.round(users * 1.3), engagement_rate: 0.45 + rand() * 0.2, clicks: Math.round(users * (0.1 + rand() * 0.1)), applications: Math.floor(rand() * 4) },
    };
  }

  const apps = [
    { name: "Lara V", email: "lara.v@example.com", kind: "prenotazione", message: "Vorrei bloccare 4 sessioni vocali a novembre", at: addDays(TODAY, -2) },
    { name: "Rocco Beats", email: "rocco@example.com", kind: "candidatura", message: "Mi mandate il listino dei beat?", at: addDays(TODAY, -5) },
    { name: "Nova Kid", email: "nova.kid@example.com", kind: "candidatura", message: "Ciao! Ho 5 pezzi pronti per un EP", at: addDays(TODAY, -9) },
  ];

  const notes = [
    { id: uid++, title: "Pacchetto “Emergenti” per l'inverno", body: "Bundle 3 singoli con sconto 15%, pensato per chi arriva dal sito. Proporlo a tutti i contatti 'nuovo' entro fine mese.", cat: "Strategia", pinned: true, done: false, due: null, author: "Plugghe", updated: addDays(TODAY, -3) },
    { id: uid++, title: "Backup settimanale del database", body: "Copiare data\\hub.db su Drive ogni lunedì.", cat: "Promemoria", pinned: true, done: false, due: addDays(TODAY, 3), author: "Astral", updated: addDays(TODAY, -6) },
    { id: uid++, title: "Reel dietro le quinte ogni martedì", body: "I contenuti backstage hanno il tasso di salvataggio più alto: 1 reel a settimana con la sessione del giorno.", cat: "Marketing", pinned: false, done: false, due: null, author: "Freya", updated: addDays(TODAY, -8) },
    { id: uid++, title: "Listino 2027", body: "Rivedere i prezzi di mix e master: siamo sotto la media della zona del 20%.", cat: "Crescita", pinned: false, done: false, due: addDays(TODAY, 30), author: "Plugghe", updated: addDays(TODAY, -12) },
    { id: uid++, title: "Cambiare corde al basso dello studio", body: "", cat: "Operativo", pinned: false, done: true, due: null, author: "Freya", updated: addDays(TODAY, -15) },
  ];
  return { tx, leads, artists, metrics, apps, notes, sessions, equipment, moves };
}

// ─── state ──────────────────────────────────────────────────────────────────
const S = Object.assign(makeData(), {
  user: null,
  settings: {
    rooms: ["Sala A", "Sala B"], openHour: 10, closeHour: 22, openDays: [1, 2, 3, 4, 5, 6],
    fixedCosts: [["Affitto", 140000], ["Utenze", 25000], ["Software & plugin", 15000], ["Marketing", 30000], ["Altro", 20000]],
    tax: { coefficient: 0.67, substituteRate: 0.15, inpsRate: 0.2607, threshold: 85000, vatNumbers: 3 },
    shares: { Plugghe: 33.33, Freya: 33.33, Astral: 33.34 },
  },
  view: { week: null, finMonth: NOW.getMonth() + 1, finSource: "", crmStatus: "", noteCat: "", anaDate: addDays(TODAY, -1), chartMode: "pl", series: { income: true, expenses: true, profit: true } },
});

const ROUTES = [
  ["panoramica", "Panoramica"], ["agenda", "Agenda"], ["finanza", "Finanza"], ["incassi", "Incassi"], ["crm", "CRM"], ["artisti", "Artisti"],
  ["analytics", "Analytics"], ["soci", "Soci"], ["attrezzatura", "Attrezzatura"], ["insights", "Insights"], ["impostazioni", "Impostazioni"],
];
const route = () => { const h = location.hash.slice(1); return ROUTES.some(([r]) => r === h) ? h : "panoramica"; };

// ─── derived data ───────────────────────────────────────────────────────────
function months() {
  return Array.from({ length: 12 }, (_, i) => {
    const pre = `${YEAR}-${String(i + 1).padStart(2, "0")}`;
    let income = 0, expenses = 0;
    for (const t of S.tx) if (t.date.startsWith(pre)) t.cents > 0 ? (income += t.cents) : (expenses -= t.cents);
    const profit = income - expenses;
    return { month: i + 1, income, expenses, profit, margin: income > 0 ? profit / income : null };
  });
}
const balances = () => S.tx.reduce((a, t) => (t.source === "cash" ? (a.cash += t.cents) : (a.bank += t.cents), (a.total += t.cents), a), { cash: 0, bank: 0, total: 0 });
function artistState(a) {
  const items = a.packages.filter((p) => !p.archived).flatMap((p) => p.items);
  const total = items.length, done = items.filter((i) => i.done).length, remaining = total - done;
  const upsell = total === 0 ? "nessun-pacchetto" : remaining === 0 ? "esaurito" : remaining <= Math.max(1, Math.ceil(total * 0.25)) ? "in-esaurimento" : "attivo";
  return { total, done, remaining, upsell };
}
const UPSELL_ORDER = { esaurito: 0, "in-esaurimento": 1, attivo: 2, "nessun-pacchetto": 3 };
const sortedArtists = () => S.artists.map((a) => ({ a, s: artistState(a) })).sort((x, y) => UPSELL_ORDER[x.s.upsell] - UPSELL_ORDER[y.s.upsell] || x.a.name.localeCompare(y.a.name));
const metric = (date, src, key) => S.metrics[date]?.[src]?.[key] ?? null;

// ─── business logic (same rules as the hub) ─────────────────────────────────
const WEEKDAYS = ["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"];
const CHANNELS = ["Instagram", "TikTok", "Sito web", "Passaparola", "Eventi", "Altro"];
const TRACK_STAGES = ["Registrazione", "Mix", "Revisioni", "Master", "Consegnato"];
const EQ_CATS = ["Microfoni", "Preamp & outboard", "Monitor & cuffie", "Strumenti", "Computer & interfacce", "Software", "Arredo & acustica", "Altro"];
const mins = (t) => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));
const hoursOf = (x) => (mins(x.end) - mins(x.start)) / 60;
const dowOf = (d) => (new Date(`${d}T12:00:00`).getDay() + 6) % 7; // 0 = lunedì
const weekStart = (d) => addDays(d, -dowOf(d));
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
const artistById = (id) => S.artists.find((a) => a.id === id);
function itemInfo(itemId) { for (const a of S.artists) for (const p of a.packages) { const it = p.items.find((i) => i.id === itemId); if (it) return { a, p, it }; } return null; }
function saturation(from, to) {
  const st = S.settings; let cap = 0, booked = 0;
  for (let d = from; d <= to; d = addDays(d, 1)) if (st.openDays.includes(dowOf(d) + 1)) cap += (st.closeHour - st.openHour) * st.rooms.length;
  for (const x of S.sessions) if (x.date >= from && x.date <= to && x.status !== "annullata") booked += hoursOf(x);
  return { booked, cap, rate: cap ? booked / cap : 0 };
}
function heatmap(weeks = 8) {
  const to = addDays(weekStart(TODAY), -1), from = addDays(to, -(weeks * 7 - 1));
  const grid = Array.from({ length: 7 }, () => Array(24).fill(0));
  for (const x of S.sessions) if (x.date >= from && x.date <= to && x.status !== "annullata") for (let h = Math.floor(mins(x.start) / 60); h < Math.ceil(mins(x.end) / 60); h++) grid[dowOf(x.date)][h]++;
  const den = weeks * S.settings.rooms.length;
  return (d, h) => Math.min(1, grid[d][h] / den);
}
function packageMoney() {
  const out = [];
  for (const a of S.artists) for (const p of a.packages) {
    const paid = p.payments.reduce((t, x) => t + x.cents, 0), total = p.items.length, done = p.items.filter((i) => i.done).length;
    const delivered = total ? Math.round((p.price * done) / total) : 0, outstanding = Math.max(0, p.price - paid);
    out.push({ a, p, paid, outstanding, total, done, delivered, prepaidOwed: Math.max(0, Math.min(paid, p.price) - delivered), daysLate: p.due && outstanding > 0 && p.due < TODAY ? daysBetween(p.due, TODAY) : 0 });
  }
  return out;
}
const fixedTotal = () => S.settings.fixedCosts.reduce((a, [, c]) => a + c, 0);
const incomeBetween = (from, to) => S.tx.reduce((a, t) => (t.cents > 0 && t.date >= from && t.date <= to ? a + t.cents : a), 0);
function taxEstimate(rev) {
  const t = S.settings.tax, income = rev * t.coefficient, contrib = income * t.inpsRate, tax = Math.max(0, income - contrib) * t.substituteRate;
  return { income: Math.round(income), contrib: Math.round(contrib), tax: Math.round(tax), total: Math.round(contrib + tax), per100: t.coefficient * (t.inpsRate + (1 - t.inpsRate) * t.substituteRate) * 100 };
}
function fiscal() { const rev = incomeBetween(`${YEAR}-01-01`, `${YEAR}-12-31`); return { rev, est: taxEstimate(rev), perVat: rev / S.settings.tax.vatNumbers, thr: S.settings.tax.threshold * 100 }; }
function breakEven() {
  const from = iso(new Date(YEAR, NOW.getMonth(), 1)), to = iso(new Date(YEAR, NOW.getMonth() + 1, 0));
  const fixed = fixedTotal(), income = incomeBetween(from, to), missing = Math.max(0, fixed - income);
  const recent = S.tx.filter((t) => t.cents > 0 && (t.cat === "Sessioni" || t.cat === "Mix & Master") && t.date >= addDays(TODAY, -180));
  const avg = recent.length ? Math.round(recent.reduce((a, t) => a + t.cents, 0) / recent.length) : 15000;
  return { fixed, income, missing, avg, need: Math.ceil(missing / avg), rate: fixed ? income / fixed : 1 };
}
function channelRevenue(money = packageMoney()) {
  const m = new Map();
  for (const x of money) { const ch = x.a.channel || "Non indicato"; const e = m.get(ch) ?? { ch, paid: 0, clients: new Set() }; e.paid += x.paid; e.clients.add(x.a.id); m.set(ch, e); }
  return [...m.values()].map((e) => ({ ch: e.ch, paid: e.paid, clients: e.clients.size, avg: Math.round(e.paid / e.clients.size), leads: S.leads.filter((l) => (l.channel || "Non indicato") === e.ch).length })).sort((a, b) => b.paid - a.paid);
}
function followUps() {
  return S.leads.filter((l) => l.status !== "convertito" && l.status !== "perso").map((l) => {
    const last = l.last ?? l.created, due = l.nextDate !== null && l.nextDate <= TODAY, days = daysBetween(last, TODAY);
    return { l, due, stale: days > 7, days };
  }).filter((x) => x.due || x.stale).sort((a, b) => b.due - a.due || b.days - a.days);
}
function partnerStats(p) {
  return {
    clients: S.artists.filter((a) => a.ref === p).length,
    hours: S.sessions.filter((x) => x.engineer === p && x.status === "completata" && x.date.startsWith(String(YEAR))).reduce((a, x) => a + hoursOf(x), 0),
    services: S.artists.flatMap((a) => a.packages.flatMap((pk) => pk.items)).filter((i) => i.done && i.by === p).length,
  };
}
const residual = (e) => Math.max(0, Math.round(e.cents * (1 - daysBetween(e.purchase, TODAY) / 365.25 / e.life)));
function nextService(e) { if (!e.every) return null; const d = new Date(`${e.last ?? e.purchase}T12:00:00`); d.setMonth(d.getMonth() + e.every); return iso(d); }
function eqAlerts() {
  return S.equipment.flatMap((e) => {
    const out = [], ns = nextService(e);
    if (ns && ns <= addDays(TODAY, 14)) out.push({ e, kind: "manutenzione", date: ns, late: ns < TODAY });
    if (e.warranty && e.warranty >= TODAY && e.warranty <= addDays(TODAY, 60)) out.push({ e, kind: "garanzia", date: e.warranty, late: false });
    return out;
  });
}

const pageHead = (eyebrow, title, intro, actions = "") => `
  <header class="page-head"><div>
    <div class="eyebrow">${eyebrow}</div>

const stat = (label, value, sub = "") => `<div class="card stat"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
const empty = (glyph, title, body = "") => `<div class="empty"><div class="glyph" aria-hidden="true">${glyph}</div><h4>${title}</h4>${body ? `<div class="small">${body}</div>` : ""}</div>`;
function delta(cur, prev, invert = false) {
  if (prev === null || prev === 0) return "";
  const ch = (cur - prev) / Math.abs(prev), good = invert ? ch < 0 : ch > 0;
  return `<span class="${ch === 0 ? "" : good ? "delta-up" : "delta-down"}">${ch > 0 ? "▲" : ch < 0 ? "▼" : "•"} ${Math.abs(ch * 100).toFixed(1).replace(".", ",")}%</span>`;
}
function ring(value, total, size = 64) {
  const r = size / 2 - 5, c = 2 * Math.PI * r, pct = total ? value / total : 0;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${total - value} servizi rimasti su ${total}">
    <defs><linearGradient id="rc${size}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".35" stop-color="#8d939b"/><stop offset=".6" stop-color="#eef0f2"/><stop offset="1" stop-color="#a3a9b1"/></linearGradient></defs>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="url(#rc${size})" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c * pct} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
    <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" fill="#f5f5f7" font-size="${size / 4.2}" font-weight="650">${total - value}</text></svg>`;
}
function spark(values, dates, pct) {
  const nums = values.filter((v) => v !== null);
  if (nums.length < 2) return `<div class="xs faint" style="margin-top:10px;height:44px">Storico insufficiente per il trend</div>`;
  const W = 300, H = 44, min = Math.min(...nums), max = Math.max(...nums);
  const x = (i) => (i / (values.length - 1)) * W, y = (v) => H - 3 - ((v - min) / (max - min || 1)) * (H - 6);
  let d = "";
  values.forEach((v, i) => { if (v !== null) d += `${i > 0 && values[i - 1] !== null ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)} `; });
  return `<div class="spark-wrap" data-spark='${JSON.stringify({ values, dates, pct })}'>
    <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Andamento ultimi ${values.length} giorni">
      <path d="${d}" fill="none" stroke="#c9ced6" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
      <line class="cross" x1="0" x2="0" y1="0" y2="${H}" stroke="rgba(255,255,255,.25)" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/>
    </svg><div class="chart-tip" hidden></div></div>`;
}

const select = (name, options, current, attrs = "") => `<select class="input" name="${name}" ${attrs}>${options.map((o) => `<option ${o === current ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;

  <div class="grid cols-3 mt">
    <section class="card span-2 flush"><div class="card-head" style="padding:20px 22px 0"><h3>Contatti</h3>

        ${list.map((l) => `<tr><td><div style="font-weight:600">${esc(l.name)}</div><div class="xs faint">${[l.genre, fmtDate(l.created)].filter(Boolean).map(esc).join(" · ")}</div>${l.notes ? `<div class="xs muted" style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(l.notes)}">${esc(l.notes)}</div>` : ""}</td>
          <td class="small">${l.email ? `<div>${esc(l.email)}</div>` : ""}${l.phone ? `<div class="muted">${esc(l.phone)}</div>` : ""}${l.ig ? `<div class="muted">@${esc(l.ig.replace(/^@/, ""))}</div>` : ""}</td>
          <td class="small"><details class="disclosure"><summary><div>${l.channel ? esc(l.channel) : `<span class="faint">Canale?</span>`}</div><div class="xs faint">${SRC[l.source]}${l.ref ? ` · portato da ${l.ref}` : ""}</div></summary>

      </tbody></table></div>`}</section>
    <section class="card"><div class="card-head"><h3>Nuovo contatto</h3></div>

        <label class="field" for="l-name"><span>Nome / nome d'arte *</span><input id="l-name" class="input" name="name" required></label>

function artisti() {
  const list = sortedArtists(), n = (s) => list.filter((x) => x.s.upsell === s).length;
  const COPY = {
    esaurito: ["critical", "Pacchetto esaurito", "Tutti i servizi sono stati erogati: è il momento di proporre un nuovo pacchetto."],
    "in-esaurimento": ["warn", "In esaurimento", "Mancano pochi servizi: prepara la proposta per il prossimo pacchetto."],
    attivo: ["good", "Attivo", ""], "nessun-pacchetto": ["plain", "Nessun pacchetto", ""],
  };
  return pageHead("Pacchetti & upsell", "Artisti", "Ogni artista con i servizi acquistati. Spunta ciò che viene completato in studio: l'hub segnala quando proporre il pacchetto successivo.") + `
  <div class="grid cols-4">${stat("Artisti", list.length)}${stat("Pacchetti attivi", n("attivo") + n("in-esaurimento"))}${stat("Da proporre subito", `<span class="${n("esaurito") ? "delta-down" : ""}">${n("esaurito")}</span>`, "pacchetti esauriti")}${stat("In esaurimento", n("in-esaurimento"), "≤ 25% dei servizi rimasti")}</div>
  <div class="grid cols-3 mt" style="align-items:start">
    <div class="span-2 stack" style="gap:16px">${list.length === 0 ? `<section class="card">${empty("♪", "Nessun artista ancora")}</section>` : list.map(({ a, s }) => {
      const [bcls, blabel, hint] = COPY[s.upsell];
      const active = a.packages.filter((p) => !p.archived), archived = a.packages.filter((p) => p.archived);
      const contacts = [a.email, a.phone, a.ig].filter(Boolean).map(esc).join(" · ");
      return `<section id="artista-${a.id}" class="card ${s.upsell === "esaurito" ? "upsell-card" : s.upsell === "in-esaurimento" ? "upsell-card soon" : ""}">
        <div class="row" style="gap:16px;align-items:flex-start">${ring(s.done, s.total, 64)}
          <div class="grow"><div class="row-wrap between"><h2 class="title-l">${esc(a.name)}</h2>${badge(bcls, blabel)}</div>
            <div class="small muted" style="margin-top:4px">${s.total ? `${s.done} di ${s.total} servizi completati · ${s.remaining} rimanenti` : "Nessun servizio attivo"}${contacts ? `<span class="faint"> · ${contacts}</span>` : ""}</div>
            ${a.channel || a.ref ? `<div class="row-wrap" style="margin-top:6px">${a.channel ? badge("plain", `Da ${esc(a.channel)}`) : ""}${a.ref ? badge("plain", `Seguito da ${a.ref}`) : ""}</div>` : ""}
            ${s.total ? `<div class="meter" style="margin-top:10px"><i style="width:${(s.done / s.total) * 100}%"></i></div>` : ""}</div></div>
        ${hint ? `<div class="upsell-banner mt ${s.upsell === "esaurito" ? "" : "soon"}"><span aria-hidden="true">${s.upsell === "esaurito" ? "●" : "◐"}</span><span class="grow">${hint}</span><button class="btn btn-sm btn-chrome" data-action="open-pkg" data-id="${a.id}">Proponi pacchetto</button></div>` : ""}
        ${active.map((p) => { const d = p.items.filter((i) => i.done).length; return `<div class="mt">
          <div class="row-wrap between" style="margin-bottom:10px"><div><div class="title-m">${esc(p.name)}</div><div class="xs faint">Acquistato il ${fmtDate(p.purchased)}${p.price ? ` · ${fmtEur(p.price)}` : ""} · ${d}/${p.items.length} completati</div></div>
            <div class="row" style="gap:4px"><button class="btn btn-ghost btn-sm" data-action="pkg-archive" data-id="${p.id}">Archivia</button></div></div>
          <div class="checklist">${p.items.map((it) => `<button type="button" class="check ${it.done ? "done" : ""}" role="checkbox" aria-checked="${it.done}" data-action="item-toggle" data-id="${it.id}" title="${it.done ? `Completato ${fmtDate(it.at)} da ${it.by}` : "Segna come completato"}"><span class="box" aria-hidden="true"></span><span class="label grow">${esc(it.service)}</span></button>`).join("")}</div>
          ${(() => {
            if (!p.price) return "";
            const paid = p.payments.reduce((t, x) => t + x.cents, 0), owed = Math.max(0, p.price - paid), late = owed > 0 && p.due && p.due < TODAY;
            return `<details class="disclosure" style="margin-top:10px" ${S.view.openPay === p.id ? "open" : ""}><summary class="small"><span class="chev">›</span>
              ${owed === 0 ? badge("good", "Saldato") : `${badge(late ? "critical" : "warn", late ? "Saldo in ritardo" : "Da saldare")} <span class="muted">pagato ${fmtEur(paid)} · mancano <strong style="color:var(--text)">${fmtEur(owed)}</strong>${p.due ? ` · entro il ${fmtDate(p.due)}` : ""}</span>`}</summary>
              <div class="stack mt" style="gap:10px">
                ${p.payments.length ? `<div class="stack xs muted" style="gap:4px">${p.payments.map((x) => `<div class="row between"><span>${fmtDate(x.date)} · ${x.method}</span><span class="num">+${fmtEur(x.cents)}</span></div>`).join("")}</div>` : ""}
                ${owed > 0 ? `<form data-form="payment" data-id="${p.id}" class="row-wrap">
                  <input class="input num" name="amount" inputmode="decimal" value="${(owed / 100).toFixed(2).replace(".", ",")}" aria-label="Importo" style="width:110px">
                  <select class="input" name="method" aria-label="Metodo" style="width:120px"><option value="bonifico">Bonifico</option><option value="contanti">Contanti</option><option value="pos">POS</option></select>
                  <input class="input" type="date" name="date" value="${TODAY}" aria-label="Data" style="width:150px">
                  <button class="btn btn-sm btn-chrome" type="submit">Registra pagamento</button></form>` : ""}
                <form data-form="pkg-due" data-id="${p.id}" class="row-wrap"><span class="xs faint">Scadenza saldo</span><input class="input" type="date" name="due" value="${p.due ?? ""}" aria-label="Scadenza saldo" style="width:150px;height:30px"><button class="btn btn-ghost btn-sm" type="submit">Salva</button></form>
              </div></details>`;
          })()}</div>`; }).join("")}
        <div class="mt"><div class="row between" style="margin-bottom:8px"><div class="title-m">Brani</div><span class="xs faint">${(a.tracks ?? []).filter((t) => t.stage === 4).length}/${(a.tracks ?? []).length} consegnati</span></div>
          <div class="stack" style="gap:8px">${(a.tracks ?? []).slice().sort((x, y) => x.stage - y.stage).map((t) => `<div class="track-row"><div style="min-width:0">
            <div class="row-wrap" style="gap:8px"><strong style="font-weight:600">${esc(t.title)}</strong>${badge(t.stage === 4 ? "good" : "plain", TRACK_STAGES[t.stage])}
              ${t.revs ? `<span class="xs faint">${t.revs} ${t.revs === 1 ? "revisione" : "revisioni"} mix</span>` : ""}
              ${t.due && t.stage < 4 ? `<span class="xs ${t.due < TODAY ? "delta-down" : "faint"}">consegna ${fmtDate(t.due)}</span>` : ""}</div>
            <div class="stages" style="margin-top:8px" aria-hidden="true">${TRACK_STAGES.map((_, i) => `<i class="${i <= t.stage ? "on" : ""}"></i>`).join("")}</div></div>
            <div class="row" style="gap:2px">
              <button class="btn btn-ghost btn-sm" data-action="track" data-op="back" data-id="${t.id}" title="Fase precedente">‹</button>
              <button class="btn btn-ghost btn-sm" data-action="track" data-op="rev" data-id="${t.id}" title="Aggiungi una revisione del mix">+rev</button>
              <button class="btn btn-ghost btn-sm" data-action="track" data-op="next" data-id="${t.id}" title="Fase successiva">›</button>
              <button class="btn btn-ghost btn-sm btn-danger" data-action="track" data-op="del" data-id="${t.id}" aria-label="Elimina brano">✕</button></div></div>`).join("")}</div>
          <details class="disclosure" style="margin-top:8px"><summary class="small muted"><span class="chev">›</span> Aggiungi brano</summary>
            <form data-form="track" data-id="${a.id}" class="form-grid mt"><label class="field"><span>Titolo</span><input class="input" name="title" required></label>

function agenda() {

  const ses = S.sessions.filter((x) => x.date >= week && x.date <= days[6]).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
  const shown = days.filter((d, i) => st.openDays.includes(i + 1) || ses.some((x) => x.date === d));
  const ws = saturation(week, days[6]), ms = saturation(iso(new Date(YEAR, NOW.getMonth(), 1)), iso(new Date(YEAR, NOW.getMonth() + 1, 0)));
  const heat = heatmap(8), hours = Array.from({ length: st.closeHour - st.openHour }, (_, i) => st.openHour + i), hdays = st.openDays.map((d) => d - 1);
  const empties = hdays.reduce((a, d) => a + hours.filter((h) => heat(d, h) < 0.15).length, 0);
  const COLORS = ["var(--room-1)", "var(--room-2)", "var(--room-3)", "var(--room-4)"], rc = (r) => COLORS[Math.max(0, st.rooms.indexOf(r)) % 4];
  const HOUR = 44, BADGE = { prenotata: "info", completata: "good", annullata: "plain" };
  const pending = S.artists.flatMap((a) => a.packages.filter((p) => !p.archived).flatMap((p) => p.items.filter((it) => !it.done && !S.sessions.some((x) => x.itemId === it.id && x.status === "prenotata")).map((it) => ({ a, it }))));
  const label = (x) => esc(artistById(x.artistId)?.name ?? (x.title || "Sessione"));
  return pageHead("Sale & sessioni", "Agenda", "Prenotazioni per sala e fonico. Quando una sessione collegata a un pacchetto viene completata, il servizio si spunta da solo.",
    `<div class="segmented"><button type="button" data-action="week" data-v="-7">‹ Settimana prima</button><button type="button" data-action="week" data-v="0" aria-current="${week === weekStart(TODAY)}">Questa settimana</button><button type="button" data-action="week" data-v="7">Dopo ›</button></div>`) + `
  <div class="grid cols-4">

    ${stat("Saturazione del mese", fmtPct(ms.rate), `${Math.round(ms.cap - ms.booked)} ore di sala ancora vendibili`)}
    ${stat("Sessioni in arrivo", ses.filter((x) => x.status === "prenotata" && x.date >= TODAY).length, "da oggi a fine settimana")}
    ${stat("Fasce quasi sempre vuote", empties, "ore/settimana sotto il 15% di occupazione")}
  </div>
  <section class="card flush mt"><div class="card-head" style="padding:20px 22px 0"><h3>Settimana dal ${new Date(`${week}T12:00:00`).toLocaleDateString("it-IT", { day: "numeric", month: "long" })}</h3><div class="legend">${st.rooms.map((r) => `<span><i style="background:${rc(r)}"></i>${esc(r)}</span>`).join("")}</div></div>
    <div class="week-scroll" style="padding:8px 12px 16px"><div class="week" style="--days:${shown.length};--hour-h:${HOUR}px">
      <div></div>${shown.map((d) => `<div class="week-head ${d === TODAY ? "today" : ""}"><span>${WEEKDAYS[dowOf(d)]} ${Number(d.slice(8))}</span></div>`).join("")}
      <div class="hours-col">${hours.map((h) => `<div>${h}:00</div>`).join("")}</div>
      ${shown.map((d) => `<div class="day-col ${st.openDays.includes(dowOf(d) + 1) ? "" : "closed"}" style="height:${hours.length * HOUR}px">${ses.filter((x) => x.date === d).map((x) => {
        const n = st.rooms.length, ri = Math.max(0, st.rooms.indexOf(x.room)), top = ((mins(x.start) - st.openHour * 60) / 60) * HOUR, h = Math.max(22, hoursOf(x) * HOUR - 2);

          <span class="t">${x.start}${x.status === "completata" ? " ✓" : ""}</span><b>${label(x)}</b>${h > 50 ? `<span class="t">${esc(svc || "")}${svc ? " · " : ""}${x.engineer}</span>` : ""}</a>`;

      </tbody></table></div>`}</section>
    <section class="card"><div class="card-head"><h3>Prenota una sessione</h3></div>
      <form data-form="session" class="stack">
        <div class="form-grid"><label class="field" for="s-date"><span>Giorno</span><input id="s-date" class="input" type="date" name="date" value="${TODAY < week ? week : TODAY}" required></label>

          ${[...new Set(pending.map((x) => x.a))].map((a) => `<optgroup label="${esc(a.name)}">${pending.filter((x) => x.a === a).map((x) => `<option value="${x.it.id}">${esc(x.it.service)}</option>`).join("")}</optgroup>`).join("")}</select></label>

          <label class="field" for="s-title"><span>Nota</span><input id="s-title" class="input" name="title" placeholder="Es. provino voce"></label></div>

function incassi() {

  const late = recv.filter((x) => x.daysLate > 0), pre = money.filter((x) => x.prepaidOwed > 0 && !x.p.archived).sort((a, b) => b.prepaidOwed - a.prepaidOwed);

  const pays = S.artists.flatMap((a) => a.packages.flatMap((p) => p.payments.map((x) => ({ ...x, a, p })))).sort((x, y) => y.date.localeCompare(x.date)).slice(0, 15);
  const METHOD = { bonifico: "Bonifico", contanti: "Contanti", pos: "POS / carta" };
  return pageHead("Acconti, saldi e crediti", "Incassi", "Cosa vi devono gli artisti e cosa avete già incassato ma dovete ancora erogare. I pagamenti si registrano dalla scheda di ogni pacchetto in Artisti.", `<a class="btn btn-chrome" href="#artisti">Registra un pagamento</a>`) + `

    ${stat("In ritardo", `<span class="${late.length ? "delta-down" : ""}">${fmtEur(late.reduce((a, x) => a + x.outstanding, 0))}</span>`, late.length ? `${late.length} ${late.length === 1 ? "pacchetto" : "pacchetti"} oltre la scadenza` : "Nessun ritardo")}
    ${stat("Servizi prepagati da erogare", fmtEur(preTot), "già incassati, lavoro ancora da fare")}
    ${stat("Incassato da pacchetti questo mese", fmtEur(pays.filter((x) => x.date.slice(0, 7) === TODAY.slice(0, 7)).reduce((a, x) => a + x.cents, 0)))}
  </div>
  <div class="grid cols-3 mt" style="align-items:start">

      ${recv.map((x) => `<tr><td><a href="#artisti" style="font-weight:600">${esc(x.a.name)}</a><div class="xs faint">${esc(x.p.name)}</div><div class="meter" style="margin-top:6px;max-width:220px"><i style="width:${(x.paid / x.p.price) * 100}%"></i></div></td>

        <td style="white-space:nowrap">${x.p.due ? (x.daysLate ? badge("critical", `${x.daysLate} gg di ritardo`) : `<span class="small muted">${fmtDate(x.p.due)}</span>`) : `<span class="xs faint">Non fissata</span>`}</td></tr>`).join("")}
      </tbody></table></div>`}</section>

function soci() {
  const profit = months().reduce((a, m) => a + m.profit, 0), taxes = fiscal().est.total;
  const prepaid = packageMoney().filter((x) => !x.p.archived).reduce((a, x) => a + x.prepaidOwed, 0), dist = Math.max(0, profit - taxes - prepaid);
  const moves = S.moves.filter((m) => m.date.startsWith(String(YEAR))).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

    const v = moves.filter((m) => m.partner === p && m.kind === "versamento").reduce((a, m) => a + m.cents, 0), due = Math.round(dist * share);

const SCREENS = { panoramica, agenda, finanza, incassi, crm, artisti, analytics, soci, attrezzatura, insights, impostazioni };

// ─── render loop ────────────────────────────────────────────────────────────
const app = document.getElementById("app");
let lastRoute = null;
function render() {
  disposeChart();
  if (!S.user) { app.innerHTML = loginScreen(); return; }
  const r = route(), y = r === lastRoute ? window.scrollY : 0;
  app.innerHTML = shell(SCREENS[r]());
  window.scrollTo(0, y);
  lastRoute = r;
  if (r === "finanza") mountChart();
}
window.addEventListener("hashchange", render);

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 2600);
}
const findItem = (id) => { for (const a of S.artists) for (const p of a.packages) { const it = p.items.find((i) => i.id === id); if (it) return it; } };
const findPkg = (id) => { for (const a of S.artists) { const p = a.packages.find((x) => x.id === id); if (p) return p; } };

// ─── events ─────────────────────────────────────────────────────────────────
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action, id = Number(el.dataset.id), v = el.dataset.v, V = S.view;
  switch (a) {
    case "logout": S.user = null; location.hash = ""; break;
    case "fin-source": V.finSource = v; break;
    case "fin-month": V.finMonth = Number(v); break;
    case "chart-mode": V.chartMode = v; break;
    case "series": V.series[v] = !V.series[v]; if (!Object.values(V.series).some(Boolean)) V.series[v] = true; break;
    case "bank-sync": toast("Nella demo la banca non è collegata: nella versione reale importi l'estratto conto CSV."); return;
    case "drive-sync": toast("Drive sincronizzato: nessun nuovo contatto."); return;
    case "tx-del": S.tx = S.tx.filter((t) => t.id !== id); toast("Movimento eliminato."); break;
    case "crm-status": V.crmStatus = v; break;
    case "lead-del": S.leads = S.leads.filter((l) => l.id !== id); toast("Contatto eliminato."); break;
    case "lead-convert": {
      const l = S.leads.find((x) => x.id === id); l.status = "convertito";
      const art = { id: uid++, name: l.name, email: l.email, phone: l.phone, ig: l.ig ? `@${l.ig.replace(/^@/, "")}` : "", channel: l.channel, ref: l.ref, packages: [], tracks: [] };
      S.artists.push(art); toast(`${l.name} è ora un artista: assegnagli un pacchetto.`);
      location.hash = "artisti"; setTimeout(() => { const d = document.getElementById(`pkg-${art.id}`); if (d) { d.open = true; d.scrollIntoView({ behavior: "smooth", block: "center" }); } }, 50);
      return;
    }
    case "item-toggle": { const it = findItem(id); it.done = !it.done; it.by = it.done ? S.user : ""; it.at = it.done ? TODAY : ""; break; }
    case "pkg-archive": findPkg(id).archived = true; break;
    case "pkg-restore": findPkg(id).archived = false; break;
    case "open-pkg": { const d = document.getElementById(`pkg-${id}`); d.open = true; d.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    case "preset": {
      const p = PRESETS[Number(el.dataset.i)], f = el.closest("form");
      f.elements.name.value = p.name; f.elements.price.value = p.price;
      SERVICES.forEach((sv) => (f.elements[`qty:${sv}`].value = p.items.find(([s]) => s === sv)?.[1] ?? 0));
      return;
    }
    case "week": V.week = v === "0" ? null : addDays(V.week ?? weekStart(TODAY), Number(v)); break;
    case "goto-session": e.preventDefault(); document.getElementById(`sessione-${id}`)?.scrollIntoView({ behavior: "smooth", block: "center" }); return;
    case "session": {
      const x = S.sessions.find((y) => y.id === id); x.status = v;
      if (x.itemId) { const info = itemInfo(x.itemId); if (info) { info.it.done = v === "completata"; info.it.by = info.it.done ? x.engineer || S.user : ""; info.it.at = info.it.done ? TODAY : ""; } }
      toast(v === "completata" ? (x.itemId ? "Sessione completata: servizio spuntato nel pacchetto." : "Sessione completata.") : v === "annullata" ? "Sessione annullata." : "Sessione ripristinata.");
      break;
    }
    case "session-del": S.sessions = S.sessions.filter((x) => x.id !== id); toast("Sessione eliminata."); break;
    case "pay-del": for (const a of S.artists) for (const p of a.packages) { const x = p.payments.find((y) => y.id === id); if (x) { p.payments = p.payments.filter((y) => y.id !== id); if (x.txId) S.tx = S.tx.filter((t) => t.id !== x.txId); } } toast("Pagamento eliminato."); break;
    case "move-del": S.moves = S.moves.filter((m) => m.id !== id); toast("Movimento eliminato."); break;
    case "eq-service": S.equipment.find((x) => x.id === id).last = TODAY; toast("Manutenzione registrata oggi."); break;
    case "eq-del": S.equipment = S.equipment.filter((x) => x.id !== id); toast("Tolto dall'inventario."); break;
    case "track": {
      for (const a of S.artists) { const t = (a.tracks ?? []).find((x) => x.id === id); if (!t) continue;
        const op = el.dataset.op;
        if (op === "del") a.tracks = a.tracks.filter((x) => x.id !== id);
        else if (op === "rev") { t.revs++; t.stage = Math.max(t.stage, 2); }
        else t.stage = Math.max(0, Math.min(4, t.stage + (op === "back" ? -1 : 1)));
      }
      break;
    }
    case "lead-contacted": {
      const l = S.leads.find((x) => x.id === id); l.last = TODAY; if (l.status === "nuovo") l.status = "contattato";
      if (l.nextDate && l.nextDate <= TODAY) { l.next = ""; l.nextDate = null; }
      toast(`${l.name}: contatto registrato.`); break;
    }
    case "note-cat": V.noteCat = v; break;
    case "note-pin": { const n = S.notes.find((x) => x.id === id); n.pinned = !n.pinned; break; }
    case "note-done": { const n = S.notes.find((x) => x.id === id); n.done = !n.done; break; }
    case "note-del": S.notes = S.notes.filter((n) => n.id !== id); toast("Nota eliminata."); break;
    default: return;
  }
  render();
});

  const id = Number(el.dataset.id);
  if (el.dataset.change === "tx-cat") { S.tx.find((t) => t.id === id).cat = el.value; toast("Categoria aggiornata."); }
  if (el.dataset.change === "lead-status") S.leads.find((l) => l.id === id).status = el.value;
  if (el.dataset.change === "ana-date" && el.value) S.view.anaDate = el.value < addDays(TODAY, -60) ? addDays(TODAY, -60) : el.value > addDays(TODAY, -1) ? addDays(TODAY, -1) : el.value;
  render();
});

document.addEventListener("submit", (e) => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  switch (f.dataset.form) {
    case "login":
      if (d.password !== DEMO_PASSWORD) { const err = document.getElementById("login-error"); err.textContent = "Password non corretta."; err.hidden = false; return; }
      S.user = d.partner; if (!location.hash) location.hash = "panoramica"; break;
    case "cash": {
      const c = parseEuro(d.amount);
      if (!c || c <= 0) return toast("Inserisci un importo valido.");
      const out = d.dir === "out";
      S.tx.push({ id: uid++, date: d.date || TODAY, cents: out ? -c : c, desc: d.desc, cat: d.cat, source: "cash", by: S.user });
      S.view.finMonth = Number((d.date || TODAY).slice(5, 7));
      toast(`${out ? "Uscita" : "Entrata"} in contanti registrata: guarda il grafico.`); break;
    }
    case "lead": S.leads.push({ id: uid++, name: d.name, email: d.email, phone: d.phone, ig: d.ig, genre: d.genre, notes: d.notes, source: "manuale", status: "nuovo", channel: d.channel, ref: d.ref, next: "", nextDate: null, last: null, created: TODAY }); toast(`${d.name} aggiunto alla pipeline.`); break;
    case "artist": S.artists.push({ id: uid++, name: d.name, email: d.email, phone: d.phone, ig: d.ig, channel: d.channel, ref: d.ref, packages: [], tracks: [] }); toast(`${d.name} aggiunto.`); break;
    case "lead-channel": { const l = S.leads.find((x) => x.id === Number(f.dataset.id)); l.channel = d.channel; l.ref = d.ref; toast("Provenienza aggiornata."); break; }
    case "lead-followup": { const l = S.leads.find((x) => x.id === Number(f.dataset.id)); l.next = d.next; l.nextDate = d.nextDate || null; toast("Prossima azione salvata."); break; }
    case "payment": {
      const c = parseEuro(d.amount); if (!c || c <= 0) return toast("Inserisci un importo valido.");
      const pk = S.artists.flatMap((a) => a.packages.map((p) => ({ a, p }))).find((x) => x.p.id === Number(f.dataset.id));
      const pay = { id: uid++, date: d.date || TODAY, cents: c, method: d.method, by: S.user };
      if (d.method === "contanti") { pay.txId = uid++; S.tx.push({ id: pay.txId, date: pay.date, cents: c, desc: `${pk.p.name} — ${pk.a.name}`, cat: "Pacchetti", source: "cash", by: S.user }); }
      pk.p.payments.push(pay); S.view.openPay = pk.p.id;
      toast(d.method === "contanti" ? "Pagamento registrato e aggiunto ai movimenti in contanti." : "Pagamento registrato."); break;
    }
    case "pkg-due": { const pk = S.artists.flatMap((a) => a.packages).find((p) => p.id === Number(f.dataset.id)); pk.due = d.due || null; S.view.openPay = pk.id; toast("Scadenza salvata."); break; }
    case "track": { const a = S.artists.find((x) => x.id === Number(f.dataset.id)); (a.tracks ??= []).push({ id: uid++, title: d.title, stage: 0, revs: 0, due: d.due || null, url: "" }); toast(`“${d.title}” aggiunto.`); break; }
    case "session": {
      const err = document.getElementById("session-error");
      const fail = (msg) => { err.textContent = msg; err.hidden = false; };
      if (!d.date || !d.start || !d.end) return fail("Indica data, ora di inizio e di fine.");
      if (d.end <= d.start) return fail("L'orario di fine deve essere dopo l'inizio.");
      const clash = S.sessions.find((x) => x.date === d.date && x.room === d.room && x.status !== "annullata" && x.start < d.end && x.end > d.start);
      if (clash) return fail(`${d.room} è già occupata dalle ${clash.start} alle ${clash.end}.`);
      const itemId = Number(d.item) || null, info = itemId ? itemInfo(itemId) : null;
      S.sessions.push({ id: uid++, date: d.date, start: d.start, end: d.end, room: d.room, engineer: d.engineer, artistId: info ? info.a.id : Number(d.artist) || null, itemId, title: d.title, status: "prenotata" });
      S.view.week = weekStart(d.date) === weekStart(TODAY) ? null : weekStart(d.date);
      toast("Sessione prenotata."); break;
    }
    case "move": {
      const c = parseEuro(d.amount); if (!c || c <= 0) return toast("Inserisci un importo valido.");
      S.moves.push({ id: uid++, date: d.date || TODAY, partner: d.partner, kind: d.kind, cents: c, note: d.note }); toast("Movimento registrato."); break;
    }
    case "equipment": {
      const months = Number(d.every);
      S.equipment.push({ id: uid++, name: d.name, cat: d.cat, purchase: d.purchase || TODAY, cents: Math.max(0, parseEuro(d.cost || "0") ?? 0), life: Math.min(20, Math.max(1, Number(d.life) || 5)), warranty: d.warranty || null, every: months > 0 ? months : null, last: null, notes: "" });
      toast(`${d.name} aggiunto all'inventario.`); break;
    }
    case "settings": {
      const msg = document.getElementById("settings-msg");
      const fail = (m) => { msg.textContent = m; msg.className = "notice critical"; msg.hidden = false; };
      const num = (v) => Number(String(v).replace(",", "."));
      const open = Math.round(num(d.open)), close = Math.round(num(d.close));
      if (!(open >= 0 && close <= 24 && close > open)) return fail("Orari non validi: la chiusura deve essere dopo l'apertura.");
      const shares = Object.fromEntries(PARTNERS.map((p) => [p, num(d[`share-${p}`])]));
      const tot = Object.values(shares).reduce((a, b) => a + b, 0);
      if (Math.abs(tot - 100) > 0.5) return fail(`Le quote dei soci devono sommare 100% (ora ${tot.toFixed(1).replace(".", ",")}%).`);
      const rooms = d.rooms.split(",").map((r) => r.trim()).filter(Boolean);
      const pct = (v, fb) => { const n = num(v); return Number.isFinite(n) && n >= 0 && n <= 100 ? n / 100 : fb; };
      const st = S.settings;
      Object.assign(st, {
        rooms: rooms.length ? rooms : st.rooms, openHour: open, closeHour: close,
        openDays: [1, 2, 3, 4, 5, 6, 7].filter((i) => d[`day${i}`] === "on"),
        fixedCosts: d.fixed.split(/\r?\n/).map((l) => l.split(/[:=]/)).filter((x) => x.length >= 2 && x[0].trim()).map(([l, ...r]) => [l.trim(), Math.max(0, parseEuro(r.join(":")) ?? 0)]),
        tax: { coefficient: pct(d.coefficient, st.tax.coefficient), substituteRate: pct(d.substitute, st.tax.substituteRate), inpsRate: pct(d.inps, st.tax.inpsRate), threshold: num(d.threshold) || st.tax.threshold, vatNumbers: Math.max(1, Math.round(num(d.vat)) || st.tax.vatNumbers) },
        shares,
      });
      toast("Parametri salvati: tasse, pareggio e quote ricalcolati."); break;
    }
    case "package": {
      const items = [];
      SERVICES.forEach((sv) => { const q = Math.min(50, Math.max(0, Number(d[`qty:${sv}`]) || 0)); for (let i = 0; i < q; i++) items.push({ id: uid++, service: q > 1 ? `${sv} ${i + 1}/${q}` : sv, done: false, by: "", at: "" }); });
      if (!items.length) return toast("Aggiungi almeno un servizio al pacchetto.");
      const a = S.artists.find((x) => x.id === Number(f.dataset.id));
      a.packages.forEach((p) => { if (p.items.every((i) => i.done)) p.archived = true; });
      const pk = { id: uid++, name: d.name || "Pacchetto personalizzato", price: Math.max(0, parseEuro(d.price || "0") ?? 0), purchased: TODAY, due: d.due || null, archived: false, items, payments: [] };
      const dep = parseEuro(d.deposit || "0");
      if (dep && dep > 0) {
        const pay = { id: uid++, date: TODAY, cents: dep, method: d.depositMethod, by: S.user };
        if (d.depositMethod === "contanti") { pay.txId = uid++; S.tx.push({ id: pay.txId, date: TODAY, cents: dep, desc: `${pk.name} — ${a.name}`, cat: "Pacchetti", source: "cash", by: S.user }); }
        pk.payments.push(pay);
      }
      a.packages.unshift(pk);
      toast(`Pacchetto assegnato a ${a.name}.`); break;
    }
    case "note": S.notes.push({ id: uid++, title: d.title, body: d.body, cat: d.cat, pinned: false, done: false, due: d.due || null, author: S.user, updated: TODAY }); toast("Nota aggiunta alla bacheca."); break;
  }
  render();
});

// sparkline crosshair + tooltip
document.addEventListener("pointermove", (e) => {
  document.querySelectorAll(".spark-wrap.on").forEach((w) => { if (!w.contains(e.target)) { w.classList.remove("on"); w.querySelector(".chart-tip").hidden = true; w.querySelector(".cross").setAttribute("visibility", "hidden"); } });
  const w = e.target.closest?.(".spark-wrap");
  if (!w) return;
  const { values, dates, pct } = JSON.parse(w.dataset.spark), svg = w.querySelector("svg"), r = svg.getBoundingClientRect();
  const i = Math.max(0, Math.min(values.length - 1, Math.round(((e.clientX - r.left) / r.width) * (values.length - 1))));
  const cross = w.querySelector(".cross"), x = (i / (values.length - 1)) * 300;
  cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
  const tip = w.querySelector(".chart-tip"), v = values[i];
  tip.innerHTML = `<div class="faint xs">${new Date(`${dates[i]}T12:00:00`).toLocaleDateString("it-IT", { day: "numeric", month: "short" })}</div><div class="num" style="font-weight:600">${v === null ? "nessun dato" : pct ? fmtPct(v) : fmtNum(v)}</div>`;
  tip.style.left = `${(i / (values.length - 1)) * 100}%`;
  tip.style.transform = `translateX(${i > values.length / 2 ? "-100%" : "0"})`;
  tip.hidden = false; w.classList.add("on");
});

// ─── 3D chart (three.js, loaded on demand) ──────────────────────────────────
let chart = null;
function disposeChart() { if (chart) { chart.dispose(); chart = null; } }
// The chart module (below) resolves this once three.js has loaded from the CDN.
const chartModule = new Promise((resolve, reject) => {
  window.__chartReady = resolve;
  setTimeout(() => reject(new Error("three.js non caricato")), 20000);
});
async function mountChart() {
  const host = document.getElementById("chart3d");
  try {
    const createChart = await chartModule;
    if (document.getElementById("chart3d") !== host) return; // navigated away meanwhile
    chart = createChart(host, { months: months(), mode: S.view.chartMode, series: { ...S.view.series }, fmtEur, fmtPct, MONTHS });
  } catch (err) {
    host.innerHTML = `<div class="empty" style="position:absolute;inset:0;display:grid;place-content:center"><h4>Grafico 3D non disponibile</h4><div class="small">Il browser non è riuscito a caricare il motore 3D. I valori sono nella tabella del conto economico.</div></div>`;
    console.error(err);
  }
}

render();
